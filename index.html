}

async function loadOverrides() {
  overrideDocs = await dbGetAll('overrides');
  if (!overrideDocs || !overrideDocs.length) {
    try {
      const raw = localStorage.getItem('contentOverrides');
      if (raw) overrideDocs = JSON.parse(raw) || [];
    } catch (e) { /* ignore */ }
  }
  return overrideDocs;
}

// 把 IndexedDB 中的修订合并进 textbooks（每次都从原始快照重放，保证可反复执行）
async function applyOverrides() {
  resetToPristine();
  await loadOverrides();
  overrideDocs.forEach(doc => {
    const unit = getUnitByScope(doc.textbookId, doc.volumeId, doc.chapter, doc.unit);
    if (!unit) return;
    (doc.words || []).forEach(p => {
      const idx = unit.words.findIndex(w => w.word === p.orig);
      // 修订里没填音标时沿用教材原有的音标，避免被空值覆盖
      const oldPh = idx >= 0 ? (unit.words[idx].phonetic || '') : '';
      const rec = { word: p.word, phonetic: p.phonetic || oldPh, meaning: p.meaning || '', examples: p.examples || [] };
      if (p.type) rec.type = p.type;
      if (idx >= 0) {
        if (p.deleted) { unit.words.splice(idx, 1); return; }
        unit.words[idx] = rec;
      } else if (!p.deleted) {
        unit.words.push(rec);
      }
    });
    (doc.sentences || []).forEach(p => {
      const idx = unit.sentences.findIndex(s => s.en === p.orig);
      const rec = { en: p.en, cn: p.cn || '' };
      if (idx >= 0) {
        if (p.deleted) { unit.sentences.splice(idx, 1); return; }
        unit.sentences[idx] = rec;
      } else if (!p.deleted) {
        unit.sentences.push(rec);
      }
    });
  });
  phoneticDict = null; // 让新增/修改的词条重新参与音标词典
}

async function saveUnitPatch(scope, mutate) {
  const id = unitScopeKey(scope.tbId, scope.vol, scope.ci, scope.ui);
  let doc = await dbGet('overrides', id);
  if (!doc) doc = (overrideDocs || []).find(d => d.id === id) || null;
  if (!doc) {
    doc = {
      id,
      email: currentUser ? currentUser.email : 'guest',
      textbookId: scope.tbId,
      volumeId: scope.vol,
      chapter: scope.ci,
      unit: scope.ui,
      words: [],
      sentences: []
    };
  }
  mutate(doc);
  doc.updatedAt = Date.now();
  await dbPut('overrides', doc);
  // 本地镜像：IndexedDB 不可用（如某些 file:// 环境）时也能保住修订
  try {
    overrideDocs = overrideDocs.filter(d => d.id !== doc.id).concat([doc]);
    localStorage.setItem('contentOverrides', JSON.stringify(overrideDocs));
  } catch (e) { /* ignore */ }
  await applyOverrides();
  return doc;
}

async function mirrorOverrides() {
  try {
    localStorage.setItem('contentOverrides', JSON.stringify(overrideDocs || []));
  } catch (e) { /* ignore */ }
}

/* ---------- 内容体检 ---------- */
function duplicateWordsOf(unit) {
  const seen = new Set(), dup = new Set();
  unit.words.forEach(w => {
    const k = String(w.word || '').toLowerCase();
    if (seen.has(k)) dup.add(k);
    seen.add(k);
  });
  return dup;
}

function wordIssues(w, dupSet) {
  const issues = [];
  if (!w.word || !String(w.word).trim()) issues.push('词条为空');
  const p = String(w.phonetic || '').trim();
  if (!p) issues.push('缺音标');
  else {
    if (!/^\/.*\/$/.test(p)) issues.push('音标格式应为 /.../');
    if (/ɒ|əʊ|eə|ɪə|ʊə/.test(p)) issues.push('疑似英式音标');
  }
  if (!String(w.meaning || '').trim()) issues.push('缺中文释义');
  if (dupSet && dupSet.has(String(w.word || '').toLowerCase())) issues.push('本单元重复');
  return issues;
}

function sentenceIssues(s) {
  const issues = [];
  if (!String(s.en || '').trim()) issues.push('英文为空');
  if (!String(s.cn || '').trim()) issues.push('缺中文');
  return issues;
}

function patchKeyFor(kind, item, doc) {
  if (!doc) return null;
  const list = kind === 'word' ? doc.words : doc.sentences;
  const text = kind === 'word' ? item.word : item.en;
  const rec = list.find(p => p.orig === text || (kind === 'word' ? p.word : p.en) === text);
  return rec ? rec.orig : null;
}

function updatePhFillProgress() {
  const pg = document.getElementById('mg-ph-progress');
  if (pg) pg.textContent = phFillState.running ? `补齐中 ${phFillState.done}/${phFillState.total}（已补齐 ${phFillState.hit}）` : '';
  const btn = document.getElementById('mg-ph-btn');
  if (btn) btn.textContent = phFillState.running ? '停止补齐' : '联网补齐音标';
}

async function fillUnitPhonetics() {
  if (phFillState.running) { phFillState.stop = true; updatePhFillProgress(); return; }
  const scope = manageScope();
  const unit = getUnitByScope(scope.tbId, scope.vol, scope.ci, scope.ui);
  if (!unit) return;
  const targets = unit.words.filter(w => w.word && !String(w.phonetic || '').trim());
  if (!targets.length) { toast('本单元没有缺失音标的词条'); return; }

  phFillState = { running: true, stop: false, done: 0, total: targets.length, hit: 0 };
  updatePhFillProgress();

  let netDead = false;
  const found = new Map();
  await fillMissingPhonetics(targets, 0, {
    getEn: function (w) { return w.word; },
    setPh: function (w, p) { found.set(w.word, p); },
    onProgress: function (done, total, hit) {
      phFillState.done = done; phFillState.hit = hit; phFillState.total = total;
      updatePhFillProgress();
    },
    shouldStop: function () { return phFillState.stop; },
    onDead: function () { netDead = true; }
  });

  if (found.size) {
    await saveUnitPatch(scope, doc => {
      found.forEach(function (ph, word) {
        const src = unit.words.find(w => w.word === word) || {};
        const rec = doc.words.find(p => (p.orig || p.word) === word);
        if (rec) {
          rec.phonetic = ph;
          if (!rec.meaning) rec.meaning = src.meaning || '';
        } else {
          doc.words.push({
            orig: word, word: word, phonetic: ph, meaning: src.meaning || '',
            examples: src.examples || [], type: src.type || (/\s/.test(word) ? 'phrase' : 'word')
          });
        }
      });
    });
  }
  const stopped = phFillState.stop;
  const n = found.size;
  phFillState = { running: false, stop: false, done: 0, total: 0, hit: 0 };
  if (stopped) toast(`已停止，本轮补齐 ${n} 个音标`);
  else if (netDead) toast(`网络查询中断，本轮补上 ${n} 个音标。请检查网络/代理后重试`, 6000);
  else toast(`补齐完成，补上 ${n} 个音标`);
  refreshAfterContentChange();
}

/* ---------- 管理面板 ---------- */
function openContentManager() {
  const tb = getCurrentTextbook();
  manageState = {
    tb: currentTextbook,
    vol: tb.hasVolumes ? (currentVolume === null ? 0 : currentVolume) : null,
    ci: currentChapter === null ? 0 : currentChapter,
    ui: currentUnit === null ? 0 : currentUnit,
    q: '',
    onlyIssue: false,
    showDeleted: false
  };
  renderContentManager();
}

function manageScope() {
  const tb = textbooks[manageState.tb];
  return {
    tbId: tb.id,
    vol: tb.hasVolumes ? manageState.vol : null,
    ci: manageState.ci,
    ui: manageState.ui
  };
}

function renderContentManager() {
  const area = document.getElementById('practice-area');
  const tb = textbooks[manageState.tb];
  const units = getUnitsOf(manageState.tb, manageState.vol);
  if (!units.length) { area.innerHTML = `<div class="mg-empty">该教材暂无内容</div>`; return; }
  const chapter = units[manageState.ci] || units[0];
  const unit = chapter.units[manageState.ui] || chapter.units[0];
  manageState.ci = units.indexOf(chapter);
  manageState.ui = chapter.units.indexOf(unit);

  const scope = manageScope();
  const doc = overrideDocs.find(d => d.id === unitScopeKey(scope.tbId, scope.vol, scope.ci, scope.ui)) || null;
  const dup = duplicateWordsOf(unit);
  const q = manageState.q.trim().toLowerCase();

  const rows = [];
  unit.words.forEach(w => {
    const issues = wordIssues(w, dup);
    const hay = (w.word + ' ' + (w.meaning || '') + ' ' + (w.phonetic || '')).toLowerCase();
    if (q && hay.indexOf(q) < 0) return;
    if (manageState.onlyIssue && !issues.length) return;
    rows.push({ kind: 'word', data: w, issues, key: patchKeyFor('word', w, doc) });
  });
  unit.sentences.forEach(s => {
    const issues = sentenceIssues(s);
    const hay = (s.en + ' ' + (s.cn || '')).toLowerCase();
    if (q && hay.indexOf(q) < 0) return;
    if (manageState.onlyIssue && !issues.length) return;
    rows.push({ kind: 'sentence', data: s, issues, key: patchKeyFor('sentence', s, doc) });
  });

  // 已删除的条目：单独列出，方便一键还原
  if (doc && manageState.showDeleted) {
    (doc.words || []).forEach(p => {
      if (!p.deleted) return;
      if (unit.words.some(w => w.word === p.orig)) return;
      const hay = (p.orig + ' ' + (p.meaning || '')).toLowerCase();
      if (q && hay.indexOf(q) < 0) return;
      rows.push({
        kind: 'word', deleted: true, issues: [], key: p.orig,
        data: { word: p.word || p.orig, phonetic: p.phonetic || '', meaning: p.meaning || '' }
      });
    });
    (doc.sentences || []).forEach(p => {
      if (!p.deleted) return;
      if (unit.sentences.some(s => s.en === p.orig)) return;
      const hay = (p.orig + ' ' + (p.cn || '')).toLowerCase();
      if (q && hay.indexOf(q) < 0) return;
      rows.push({
        kind: 'sentence', deleted: true, issues: [], key: p.orig,
        data: { en: p.en || p.orig, cn: p.cn || '' }
      });
    });
  }
  manageRows = rows;

  const totalIssues = (() => {
    let n = 0;
    unit.words.forEach(w => { n += wordIssues(w, dup).length; });
    unit.sentences.forEach(s => { n += sentenceIssues(s).length; });
    return n;
  })();

  area.classList.add('manage-mode');
  area.innerHTML = `
    <div class="manage-panel" id="manage-panel">
      <div class="manage-sticky">
        <div class="manage-head">
          <h3>内容管理 · 纠错 / 新增</h3>
          <div class="mg-ops">
            <button class="mg-btn" onclick="openBulkImport()">批量导入</button>
            <button class="mg-btn" id="mg-ph-btn" onclick="fillUnitPhonetics()">${phFillState.running ? '停止补齐' : '联网补齐音标'}</button>
            <button class="mg-btn" onclick="exportOverrides()">导出修订</button>
            <button class="mg-btn" onclick="importOverrides()">导入修订</button>
            <button class="mg-btn" onclick="closeContentManager()">返回练习</button>
          </div>
          <span class="manage-count" id="mg-ph-progress">${phFillState.running ? `补齐中 ${phFillState.done}/${phFillState.total}（已补齐 ${phFillState.hit}）` : ''}</span>
        </div>
        <div class="manage-bar">
          <button class="mg-btn primary" onclick="openItemEditor('word', null, null, 'word')">＋ 新增单词</button>
          <button class="mg-btn primary" onclick="openItemEditor('word', null, null, 'phrase')">＋ 新增短语</button>
          <button class="mg-btn primary" onclick="openItemEditor('sentence', null)">＋ 新增句子</button>
          <label class="manage-count"><input type="checkbox" ${manageState.onlyIssue ? 'checked' : ''} onchange="onManageIssueOnly(this.checked)"> 仅看有问题的</label>
          <label class="manage-count"><input type="checkbox" ${manageState.showDeleted ? 'checked' : ''} onchange="onManageShowDeleted(this.checked)"> 显示已删除</label>
          <span class="manage-count">共 ${unit.words.length} 词 / ${unit.sentences.length} 句${totalIssues ? `，发现 ${totalIssues} 处待修正` : '，未发现问题'}${doc ? '（本单元已有修订）' : ''}</span>
        </div>
      </div>
      <div class="manage-tip">
        修改只保存在本机（IndexedDB），不会改动原始文件；「自动填充」需要联网查询音标 / 中文 / 例句，失败时可手动填写。
        导出后可以让我把修订合并回源码，永久生效。
      </div>

      <div class="manage-filters">
        <select onchange="onManageTbChange(this.value)">
          ${textbooks.map((t, i) => `<option value="${i}" ${i === manageState.tb ? 'selected' : ''}>${t.icon || ''} ${t.title}</option>`).join('')}
        </select>
        ${tb.hasVolumes ? `<select onchange="onManageVolChange(this.value)">
          ${tb.volumes.map((v, i) => `<option value="${i}" ${i === manageState.vol ? 'selected' : ''}>${v.titleCn} ${v.title}</option>`).join('')}
        </select>` : ''}
        <select onchange="onManageChapterChange(this.value)">
          ${units.map((c, i) => `<option value="${i}" ${i === manageState.ci ? 'selected' : ''}>${c.chapter}: ${c.title}</option>`).join('')}
        </select>
        <select onchange="onManageUnitChange(this.value)">
          ${chapter.units.map((u, i) => `<option value="${i}" ${i === manageState.ui ? 'selected' : ''}>${u.title}</option>`).join('')}
        </select>
        <input id="mg-q" type="text" placeholder="搜索英文 / 中文 / 音标" value="${escHtml(manageState.q)}" oninput="onManageSearch(this.value)">
      </div>

      <div class="manage-list">
        ${rows.length ? rows.map((r, i) => {
          const d = r.data;
          const kind = r.kind;
          const text = kind === 'word' ? d.word : d.en;
          const sub = kind === 'word'
            ? `${d.phonetic || '（无音标）'} · ${d.meaning || '（无释义）'}${(d.examples && d.examples.length) ? ' · ' + d.examples.length + ' 例句' : ''}`
            : (d.cn || '（无中文）');
          const isEdited = r.key !== null && r.key !== undefined;
          const badge = r.deleted
            ? '已删除'
            : (kind === 'word' ? (d.type || (/\s/.test(String(d.word)) ? '短语' : '单词')) : '句子');
          return `<div class="mg-row ${r.deleted ? 'mg-deleted' : ''} ${!r.deleted && r.issues.length ? 'has-issue' : ''}">
            <span class="mg-badge ${isEdited ? 'new' : ''}">${badge}</span>
            <div class="mg-main">
              <div class="mg-en">${escHtml(text)}</div>
              <div class="mg-sub">${escHtml(sub)}</div>
              ${r.deleted
                ? `<div class="mg-issue deleted">已删除（本单元）</div>`
                : (r.issues.length ? `<div class="mg-issue">⚠ ${escHtml(r.issues.join('；'))}</div>` : '')}
            </div>
            <div class="mg-ops">
              ${r.deleted
                ? `<button class="mg-btn" onclick="revertItemByRow(${i})">还原</button>`
                : `<button class="mg-btn" onclick="openItemEditorByRow(${i})">编辑</button>
                   ${isEdited ? `<button class="mg-btn" onclick="revertItemByRow(${i})">还原</button>` : ''}
                   <button class="mg-btn danger" onclick="deleteItemByRow(${i})">删除</button>`}
            </div>
          </div>`;
        }).join('') : `<div class="mg-empty">没有匹配的内容</div>`}
      </div>
    </div>
  `;

  if (manageState.focusSearch) {
    setTimeout(() => {
      const el = document.getElementById('mg-q');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 0);
  }
}

function onManageTbChange(v) {
  manageState.tb = parseInt(v);
  const tb = textbooks[manageState.tb];
  manageState.vol = tb.hasVolumes ? 0 : null;
  manageState.ci = 0; manageState.ui = 0;
  renderContentManager();
}
function onManageVolChange(v) {
  manageState.vol = parseInt(v); manageState.ci = 0; manageState.ui = 0;
  renderContentManager();
}
function onManageChapterChange(v) {
  manageState.ci = parseInt(v); manageState.ui = 0;
  renderContentManager();
}
function onManageUnitChange(v) {
  manageState.ui = parseInt(v);
  renderContentManager();
}
function onManageSearch(v) {
  manageState.q = v;
  manageState.focusSearch = true;
  renderContentManager();
}
function onManageIssueOnly(v) {
  manageState.onlyIssue = v;
  renderContentManager();
}
function onManageShowDeleted(v) {
  manageState.showDeleted = v;
  renderContentManager();
}
function openItemEditorByRow(i) {
  const r = manageRows[i];
  if (!r) return;
  openItemEditor(r.kind, r.kind === 'word' ? r.data.word : r.data.en, manageScope());
}
async function deleteItemByRow(i) {
  const r = manageRows[i];
  if (!r) return;
  await deleteItem(r.kind, r.kind === 'word' ? r.data.word : r.data.en);
}
async function revertItemByRow(i) {
  const r = manageRows[i];
  if (!r) return;
  await saveUnitPatch(manageScope(), doc => {
    const list = r.kind === 'word' ? doc.words : doc.sentences;
    const idx = list.findIndex(p => p.orig === r.key || (r.kind === 'word' ? p.word : p.en) === r.key);
    if (idx >= 0) list.splice(idx, 1);
  });
  toast('已还原为原始内容');
  refreshAfterContentChange();
}

function closeContentManager() {
  const areaEl = document.getElementById('practice-area');
  areaEl.classList.remove('manage-mode');
  const panelEl = document.getElementById('manage-panel');
  if (panelEl) panelEl.remove();
  if (practiceItems.length && currentChapter !== null && !isWrongMode) {
    syncCurrentPracticeItem();
    renderPractice();
  } else if (currentUser && db) {
    restoreProgress();
  } else {
    renderWelcome();
  }
}

/* ---------- 编辑弹窗 ---------- */
function openItemEditor(kind, origText, scope, presetType) {
  const sc = scope || (document.getElementById('manage-panel') ? manageScope() : currentScope());
  let data = null;
  const unit = getUnitByScope(sc.tbId, sc.vol, sc.ci, sc.ui);
  if (unit && origText) {
    data = kind === 'word'
      ? unit.words.find(w => w.word === origText)
      : unit.sentences.find(s => s.en === origText);
  }
  const isNew = !data;
  editState = {
    kind,
    orig: isNew ? null : origText,
    scope: sc,
    type: presetType || (data && data.type) || (data && /\s/.test(String(data.word)) ? 'phrase' : 'word')
  };

  const title = (isNew ? '新增' : '编辑') + (kind === 'word' ? '单词 / 短语' : '句子');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'item-editor';
  overlay.innerHTML = `
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3>${title}</h3>
      <div class="modal-sub">${isNew ? '新增内容会加入所选单元' : '修改后会立即生效（含音标、释义、例句）'}</div>

      ${kind === 'word' ? `
        <div class="mg-field">
          <label>类型</label>
          <select id="ed-type" onchange="editState.type=this.value">
            <option value="word" ${editState.type === 'word' ? 'selected' : ''}>单词</option>
            <option value="phrase" ${editState.type === 'phrase' ? 'selected' : ''}>短语</option>
          </select>
        </div>
        <div class="mg-field">
          <label>英文（单词 / 短语）</label>
          <input type="text" id="ed-en" value="${escHtml(data ? data.word : '')}" placeholder="例如：alarm clock">
        </div>
        <div class="mg-field">
          <label>美式音标</label>
          <input type="text" id="ed-ph" value="${escHtml(data ? data.phonetic : '')}" placeholder="例如：/əˈlɑːrm klɑːk/">
        </div>
        <div class="mg-field">
          <label>中文释义</label>
          <input type="text" id="ed-cn" value="${escHtml(data ? data.meaning : '')}" placeholder="例如：闹钟">
        </div>
        <div class="mg-field">
          <label>例句（针对该单词 / 短语的用法）</label>
          <div id="ed-ex"></div>
          <button class="mg-btn" onclick="addExampleRow()">+ 添加例句</button>
        </div>
      ` : `
        <div class="mg-field">
          <label>英文句子</label>
          <textarea id="ed-en" placeholder="例如：Time for breakfast!">${escHtml(data ? data.en : '')}</textarea>
        </div>
        <div class="mg-field">
          <label>中文翻译</label>
          <input type="text" id="ed-cn" value="${escHtml(data ? data.cn : '')}" placeholder="例如：早餐时间到！">
        </div>
        <div class="mg-field">
          <label>音标（保存后自动生成）</label>
          <input type="text" id="ed-ph" value="" placeholder="自动按单词音标拼接" disabled>
        </div>
      `}

      <div class="mg-status" id="ed-status"></div>
      <div class="modal-ops">
        <button class="btn btn-primary" id="ed-autofill" onclick="autoFillEditor()">🔍 自动填充（音标 / 中文 / 例句）</button>
        <button class="btn btn-primary" onclick="saveItemEdit()">保存</button>
        <button class="btn" onclick="closeModal()">取消</button>
        ${isNew ? '' : `<button class="btn" onclick="revertCurrentEditor()">还原为原始内容</button>`}
      </div>
    </div>
  `;
  overlay.addEventListener('click', closeModal);
  overlay._onKey = function (e) { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', overlay._onKey);
  document.body.appendChild(overlay);
  if (kind === 'word') renderExamplesEditor((data && data.examples) ? data.examples : []);
  setTimeout(() => { const el = document.getElementById('ed-en'); if (el) el.focus(); }, 30);
}

function closeModal() {
  const m = document.getElementById('item-editor');
  if (m) {
    if (m._onKey) document.removeEventListener('keydown', m._onKey);
    m.remove();
  }
  editState = null;
}

function setEditStatus(msg) {
  const el = document.getElementById('ed-status');
  if (el) el.textContent = msg;
}

function collectExamplesFromDom() {
  const ens = document.querySelectorAll('#ed-ex .ex-en-input');
  const cns = document.querySelectorAll('#ed-ex .ex-cn-input');
  const arr = [];
  for (let i = 0; i < ens.length; i++) {
    const en = ens[i].value.trim();
    const cn = cns[i] ? cns[i].value.trim() : '';
    if (en || cn) arr.push({ en, cn });
  }
  return arr;
}

function renderExamplesEditor(list) {
  const box = document.getElementById('ed-ex');
  if (!box) return;
  box.innerHTML = (list && list.length) ? list.map((e, i) => `
    <div class="ex-edit">
      <div class="ex-head"><span>例句 ${i + 1}</span><button class="mg-btn danger" onclick="removeExampleRow(${i})">删除</button></div>
      <div class="mg-field"><input class="ex-en-input" type="text" value="${escHtml(e.en)}" placeholder="English example"></div>
      <div class="mg-field" style="margin-bottom:0"><input class="ex-cn-input" type="text" value="${escHtml(e.cn)}" placeholder="中文翻译"></div>
    </div>
  `).join('') : `<div style="font-size:12px;color:var(--text-faint);padding:4px 0">暂无例句，可点「自动填充」获取或手动添加</div>`;
}

function removeExampleRow(i) {
  const arr = collectExamplesFromDom();
  arr.splice(i, 1);
  renderExamplesEditor(arr);
}

function addExampleRow() {
  const arr = collectExamplesFromDom();
  arr.push({ en: '', cn: '' });
  renderExamplesEditor(arr);
  const ens = document.querySelectorAll('#ed-ex .ex-en-input');
  if (ens.length) ens[ens.length - 1].focus();
}

async function saveItemEdit() {
  if (!editState) return;
  const kind = editState.kind;
  const en = document.getElementById('ed-en').value.trim();
  const cn = document.getElementById('ed-cn').value.trim();
  if (!en) { setEditStatus('英文内容不能为空'); return; }

  const origKey = editState.orig || newItemKey();
  if (kind === 'sentence') {
    await saveUnitPatch(editState.scope, doc => {
      const list = doc.sentences;
      const i = list.findIndex(p => p.orig === origKey || p.en === origKey);
      const key = i >= 0 ? list[i].orig : origKey;
      const rec = { orig: key, en, cn, deleted: false };
      if (i >= 0) list[i] = rec; else list.push(rec);
    });
  } else {
    const ph = document.getElementById('ed-ph').value.trim();
    const ex = collectExamplesFromDom();
    const type = (document.getElementById('ed-type') || {}).value || editState.type;
    await saveUnitPatch(editState.scope, doc => {
      const list = doc.words;
      const i = list.findIndex(p => p.orig === origKey || p.word === origKey);
      const key = i >= 0 ? list[i].orig : origKey;
      const rec = { orig: key, word: en, phonetic: ph, meaning: cn, examples: ex, type, deleted: false };
      if (i >= 0) list[i] = rec; else list.push(rec);
    });
  }
  closeModal();
  toast('已保存');
  refreshAfterContentChange();
}

async function deleteItem(kind, text) {
  if (!confirm('确定删除「' + text + '」吗？可在内容管理中「还原」。')) return;
  await saveUnitPatch(manageScope(), doc => {
    const list = kind === 'word' ? doc.words : doc.sentences;
    const i = list.findIndex(p => p.orig === text || (kind === 'word' ? p.word : p.en) === text);
    const key = i >= 0 ? list[i].orig : text;
    const rec = kind === 'word' ? { orig: key, word: text, deleted: true } : { orig: key, en: text, deleted: true };
    if (i >= 0) list[i] = rec; else list.push(rec);
  });
  // 删除后自动展开「已删除」，方便立即撤销
  if (document.getElementById('manage-panel')) manageState.showDeleted = true;
  toast('已删除');
  refreshAfterContentChange();
}

async function revertItem(kind, key) {
  await saveUnitPatch(manageScope(), doc => {
    const list = kind === 'word' ? doc.words : doc.sentences;
    const i = list.findIndex(p => p.orig === key || (kind === 'word' ? p.word : p.en) === key);
    if (i >= 0) list.splice(i, 1);
  });
  closeModal();
  toast('已还原为原始内容');
  refreshAfterContentChange();
}

async function revertCurrentEditor() {
  if (!editState || editState.orig === null) { closeModal(); return; }
  const kind = editState.kind;
  const key = editState.orig;
  await saveUnitPatch(editState.scope, doc => {
    const list = kind === 'word' ? doc.words : doc.sentences;
    const i = list.findIndex(p => p.orig === key || (kind === 'word' ? p.word : p.en) === key);
    if (i >= 0) list.splice(i, 1);
  });
  closeModal();
  toast('已还原为原始内容');
  refreshAfterContentChange();
}

function editCurrentItem() {
  const item = practiceItems[currentIndex];
  if (!item) return;
  if (isWrongMode || currentChapter === null) {
    toast('请先在左侧目录选择一个单元');
    return;
  }
  openItemEditor(item.type === 'sentence' ? 'sentence' : 'word', item.display, currentScope());
}

function syncCurrentPracticeItem() {
  if (currentChapter === null || isWrongMode) return;
  const unit = getCurrentUnits()[currentChapter].units[currentUnit];
  const item = practiceItems[currentIndex];
  if (!unit || !item) return;
  if (item.type === 'sentence') {
    const s = unit.sentences.find(x => x.en === item.display);
    if (s) { item.translation = s.cn; item.phonetic = getSentencePhonetic(s.en); }
  } else {
    const w = unit.words.find(x => x.word === item.display);
    if (w) { item.phonetic = w.phonetic; item.translation = w.meaning; item.examples = w.examples || []; }
  }
}

function refreshAfterContentChange() {
  renderSidebar();
  updateGlobalStats();
  if (document.getElementById('manage-panel')) {
    renderContentManager();
  } else if (practiceItems.length && currentChapter !== null && !isWrongMode) {
    syncCurrentPracticeItem();
    renderPractice();
  }
}

/* ---------- 自动填充：音标 / 中文 / 例句 ---------- */
async function jfetch(url, timeout) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout || 9000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

function wrapSlash(p) {
  const s = String(p || '').trim();
  if (!s) return '';
  return s.startsWith('/') ? s : '/' + s + '/';
}

function parseWiktionaryIPA(src) {
  const m = String(src || '').match(/\{\{IPA\|en[^|]*\|([^}]+)\}\}/);
  if (!m) return '';
  const parts = m[1].split('|').map(x => x.trim());
  for (let i = 0; i < parts.length; i++) {
    if (parts[i] === 'a=GA' && parts[i + 1]) return wrapSlash(parts[i + 1]);
  }
  const first = parts.find(p => p.startsWith('/') || p.startsWith('['));
  return first ? wrapSlash(first.replace(/^\[|\]$/g, '')) : '';
}

// 音标查询结果缓存：查过的词不再重复请求，下次导入其它教材可直接命中
const PH_CACHE_KEY = 'phoneticCacheV1';
let phCacheData = null;
function phCache() {
  if (phCacheData) return phCacheData;
  try { phCacheData = JSON.parse(localStorage.getItem(PH_CACHE_KEY) || '{}') || {}; } catch (e) { phCacheData = {}; }
  return phCacheData;
}
function phCacheSave() {
  try {
    const c = phCache();
    const keys = Object.keys(c);
    if (keys.length > 8000) { // 太大就丢掉最旧的一半，避免撑爆 localStorage
      keys.sort((a, b) => (c[a].t || 0) - (c[b].t || 0));
      keys.slice(0, Math.floor(keys.length / 2)).forEach(k => delete c[k]);
    }
    localStorage.setItem(PH_CACHE_KEY, JSON.stringify(c));
  } catch (e) { /* ignore */ }
}

async function fetchPhoneticUS(word) {
  const key = String(word || '').toLowerCase().trim();
  if (!key) return '';
  const cache = phCache();
  const hit = cache[key];
  // 查到过的直接复用；查不到的 3 天内不再反复打扰网络
  if (hit && (hit.v || Date.now() - (hit.t || 0) < 3 * 24 * 3600 * 1000)) return hit.v || '';

  let res = '';
  try {
    const local = buildPhoneticDict()[key];
    if (local) res = local;
  } catch (e) { /* ignore */ }
  if (!res) {
    try {
      const data = await jfetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), 6000);
      if (Array.isArray(data) && data[0] && Array.isArray(data[0].phonetics)) {
        const phs = data[0].phonetics;
        const us = phs.find(p => p.text && /-us\d?\.mp3|us\.mp3/i.test(p.audio || ''))
          || phs.find(p => p.text && p.text.trim());
        if (us && us.text) res = wrapSlash(us.text);
      }
    } catch (e) { /* ignore */ }
  }
  if (!res) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 6000);
      try {
        const r = await fetch('https://en.wiktionary.org/w/index.php?title=' + encodeURIComponent(word) + '&action=raw&origin=*', { signal: ctl.signal });
        if (r.ok) {
          const ipa = parseWiktionaryIPA(await r.text());
          if (ipa) res = ipa;
        }
      } finally { clearTimeout(timer); }
    } catch (e) { /* ignore */ }
  }
  cache[key] = { v: res, t: Date.now() };
  phCacheSave();
  return res;
}

async function fetchZh(text) {
  try {
    const d = await jfetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|zh-CN');
    const t = d && d.responseData && d.responseData.translatedText;
    if (t && d.responseStatus === 200 && !/MYMEMORY WARNING|QUERY LENGTH LIMIT|ALLOWED/i.test(t)) return t;
  } catch (e) { /* ignore */ }
  try {
    const d = await jfetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(text));
    if (Array.isArray(d) && d[0] && d[0][0] && d[0][0][0]) return d[0][0][0];
  } catch (e) { /* ignore */ }
  return '';
}

function localExamples(word, limit) {
  const out = [];
  let re = null;
  try {
    re = new RegExp('\\b' + String(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  } catch (e) { return out; }
  textbooks.forEach(tb => {
    const pools = tb.hasVolumes ? (tb.volumes || []).map(v => v.units || []) : [tb.units || []];
    pools.forEach(units => {
      units.forEach(ch => {
        (ch.units || []).forEach(u => {
          (u.sentences || []).forEach(s => {
            if (out.length >= limit) return;
            if (re.test(s.en) && !out.some(x => x.en === s.en)) out.push({ en: s.en, cn: s.cn || '' });
          });
        });
      });
    });
  });
  return out;
}

async function fetchExamples(word, limit) {
  const need = limit || 3;
  const out = localExamples(word, need);
  if (out.length >= need) return out;
  try {
    const d = await jfetch('https://api.tatoeba.org/en/api_v0/search?query=' + encodeURIComponent(word) + '&from=eng&to=cmn');
    const rs = (d && d.results) || [];
    for (const r of rs) {
      if (out.length >= need) break;
      const en = r && r.text;
      if (!en || out.some(x => x.en === en)) continue;
      let cn = '';
      const tr = r.translations || [];
      for (const g of tr) {
        if (Array.isArray(g) && g[0] && g[0].text) { cn = g[0].text; break; }
        if (g && g.text) { cn = g.text; break; }
      }
      out.push({ en, cn });
    }
  } catch (e) { /* ignore */ }
  for (let i = 0; i < out.length && i < need; i++) {
    if (!out[i].cn) out[i].cn = await fetchZh(out[i].en);
  }
  return out;
}

async function autoFillEditor() {
  if (!editState) return;
  const kind = editState.kind;
  const enEl = document.getElementById('ed-en');

  if (!text) { setEditStatus('请先填写英文内容，再点自动填充'); return; }

  const btn = document.getElementById('ed-autofill');
  if (btn) btn.disabled = true;
  const msgs = [];
  try {

      setEditStatus('正在查询美式音标…');
      const ph = await fetchPhoneticUS(text);
      if (ph) {
        document.getElementById('ed-ph').value = ph;
        msgs.push('音标 ' + ph);
      } else {
        msgs.push('音标未查到（请手填）');
      }

      setEditStatus('正在查询中文释义…');
      const cn = await fetchZh(text);
      if (cn) {
        const cnEl = document.getElementById('ed-cn');
        if (!cnEl.value.trim()) cnEl.value = cn;
        msgs.push('中文 ' + cn);
      } else {
        msgs.push('中文未查到');
      }

      setEditStatus('正在查询例句…');
      const exs = await fetchExamples(text, 3);
      if (exs.length) {
        const cur = collectExamplesFromDom();
        exs.forEach(e => { if (!cur.some(c => c.en === e.en)) cur.push(e); });
        renderExamplesEditor(cur.slice(0, 6));
        msgs.push('例句 ' + exs.length + ' 条');
      } else {
        msgs.push('例句未查到');
      }
    } else {
      setEditStatus('正在查询中文翻译…');
      const cn = await fetchZh(text);
      if (cn) {
        const cnEl = document.getElementById('ed-cn');
        if (!cnEl.value.trim()) cnEl.value = cn;
        msgs.push('中文 ' + cn);
      } else {
        msgs.push('中文未查到');
      }
      setEditStatus('正在生成音标…');
      const ph = getSentencePhonetic(text);
      const phEl = document.getElementById('ed-ph');
      if (phEl) phEl.value = ph;
      msgs.push('音标 ' + ph);
    }
    setEditStatus('已获取：' + msgs.join(' ｜ '));
  } catch (e) {
    setEditStatus('自动填充失败（可能未联网或接口不可用），请手动填写');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ---------- PDF 导入：读取文本层 → 单词 / 音标 / 中文 ---------- */
// 只在浏览器本地读取 PDF 内嵌的文本层，不上传文件、不做 OCR。
// 注意：教材里的音标多用专用字体（金山音标体、Times Phonetic 等），很多没有正确的
// Unicode 映射，提取出来会落在私有区（U+E000-U+F8FF）变乱码。这类音标一律留空，
// 交给「自动补齐音标」联网查询，结果比乱码可靠得多。
const PDFJS_LIB_SRC = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER_SRC = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const PDF_MAX_PAGES = 300;

// IPA 及相关音标字符：IPA 扩展区 0250-02AF、修饰字母 02B0-02FF、æ ð ŋ θ
const IPA_CLASS = '\\u0250-\\u02AF\\u02B0-\\u02FF\\u00E6\\u00F0\\u014B\\u03B8\\u02E5-\\u02EF';
const IPA_TEST = new RegExp('[' + IPA_CLASS + ']');
// 私有区 / 替换符 → 字体映射缺失导致的乱码
const GARBLE_TEST = /[\uE000-\uF8FF\uFFFD]/;
const CJK_CLASS = '\\u3400-\\u4dbf\\u4e00-\\u9fff';

let pdfjsLoadPromise = null;

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsLoadPromise) return pdfjsLoadPromise;
  pdfjsLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PDFJS_LIB_SRC;
    s.onload = function () {
      if (!window.pdfjsLib) { reject(new Error('pdf.js 加载异常')); return; }
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_SRC; } catch (e) { /* ignore */ }
      resolve(window.pdfjsLib);
    };
    s.onerror = function () { reject(new Error('加载 PDF 解析库失败（首次使用需要联网）')); };
    document.head.appendChild(s);
  }).catch(function (e) { pdfjsLoadPromise = null; throw e; });
  return pdfjsLoadPromise;
}

// 带坐标的文本片段 → 视觉上的「行」：按 y 归并、按 x 排序、列间距补空格
function pdfItemsToLines(items) {
  const arr = [];
  (items || []).forEach(function (it) {
    if (!it || typeof it.str !== 'string' || it.str.trim() === '') return;
    const t = it.transform || [1, 0, 0, 1, 0, 0];
    const h = Math.abs(t[3] || it.height || 10) || 10;
    arr.push({ str: it.str.replace(/\s+/g, ' '), x: t[4] || 0, y: t[5] || 0, h: h, w: it.width || 0 });
  });
  if (!arr.length) return [];
  // PDF 的 y 轴向上，页面顶部 y 更大 → 按 y 降序才是从上往下
  arr.sort(function (a, b) {
    if (Math.abs(a.y - b.y) > 0.5) return b.y - a.y;
    return a.x - b.x;
  });
  const groups = [];
  let cur = null;
  arr.forEach(function (it) {
    if (cur && Math.abs(it.y - cur.y) <= Math.max(1.5, Math.min(cur.h, it.h) * 0.5)) {
      cur.parts.push(it);
      if (it.h > cur.h) cur.h = it.h;
    } else {
      cur = { y: it.y, h: it.h, parts: [it] };
      groups.push(cur);
    }
  });
  return groups.map(function (g) {
    g.parts.sort(function (a, b) { return a.x - b.x; });
    let out = '', prev = null;
    g.parts.forEach(function (p) {
      if (prev) {
        const unit = Math.max(0.2, prev.h * 0.22);   // 大约一个空格的宽度
        const gap = p.x - (prev.x + (prev.w || 0));
        if (gap > unit * 5) out += '   ';   // 明显分栏 → 留大间隙
        else if (gap > unit) out += ' ';
      }
      out += p.str;
      prev = p;
    });
    return out.trim();
  });
}

function countIpaChars(s) {
  const m = String(s || '').match(new RegExp('[' + IPA_CLASS + '\\uE000-\\uF8FF]', 'g'));
  return m ? m.length : 0;
}

// 在整行里定位音标：优先 /.../、其次 [...]，最后按 IPA 字符找裸音标
function pickPhonetic(s) {
  const segs = [];
  let m;
  const cm = s.match(new RegExp('[' + CJK_CLASS + ']'));
  const cjkAt = cm ? cm.index : s.length;
  // 音标只可能出现在中文之前；纯 ASCII 型音标（如 /get/）只在「本行有中文」时才采信，
  // 否则 and/or 这类英文里的斜杠会被误当成音标
  const okPh = function (inner, start) {
    if (start > cjkAt) return false;
    if (IPA_TEST.test(inner) || /[\u02C8\u02CC\u02D0\u02D1]/.test(inner) || GARBLE_TEST.test(inner)) return true;
    return cjkAt < s.length && /^[A-Za-z'’,.:;^\- ]{1,60}$/.test(inner);
  };
  const reSlash = /\/([^\/\n]{1,80})\//g;
  while ((m = reSlash.exec(s))) {
    if (okPh(m[1], m.index)) segs.push({ text: m[1], start: m.index, end: m.index + m[0].length });
  }
  if (!segs.length) {
    const reBr = /\[([^\[\]\n]{1,80})\]/g;
    while ((m = reBr.exec(s))) {
      if (okPh(m[1], m.index)) segs.push({ text: m[1], start: m.index, end: m.index + m[0].length });
    }
  }
  if (!segs.length) {
    const reBare = new RegExp('[^\\s' + CJK_CLASS + ']*[' + IPA_CLASS + '\\uE000-\\uF8FF][^' + CJK_CLASS + ']*', 'g');
    while ((m = reBare.exec(s))) {
      const t = m[0].trim();
      if (t) segs.push({ text: t, start: m.index, end: m.index + m[0].length });
    }
  }
  if (!segs.length) return null;
  segs.sort(function (a, b) { return countIpaChars(b.text) - countIpaChars(a.text); });
  return segs[0];
}

// 一行教材文本 → { en, ph, cn }；不像词条则返回 null
function parsePdfEntryLine(raw) {
  let s = String(raw == null ? '' : raw)
    .replace(/[\u0000-\u001F\u007F]/g, ' ')
    .replace(/\s+/g, ' ').trim();
  if (!s || s.length > 400) return null;
  if (/^\d{1,4}$/.test(s)) return null;                                  // 页码
  if (/^(page\s*)?\d+\s*(\/\s*\d+)?$/i.test(s)) return null;             // 页码 / 1/23
  if (/^(page|chapter|unit|lesson|第)\s*[\divx]+\s*(页|of)?.*$/i.test(s) && s.length < 30) return null;

  let ph = '', garbled = false;
  const slot = pickPhonetic(s);
  if (slot) {
    if (GARBLE_TEST.test(slot.text)) garbled = true;
    else ph = slot.text.trim();
    s = (s.slice(0, slot.start) + ' ' + s.slice(slot.end)).replace(/\s+/g, ' ').trim();
  }

  // 中文：从第一个汉字起到行尾
  let en = s, cn = '';
  const cm = s.match(new RegExp('[' + CJK_CLASS + ']'));
  if (cm) {
    cn = s.slice(cm.index).trim();
    en = s.slice(0, cm.index).trim();
  }
  // 去掉词性标记：n. v. adj. 等
  en = en.replace(/[\s,;·、]+(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|abbr|aux|pl)\.\s*$/i, '').trim();
  cn = cn.replace(/^[（(\[]?\s*(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|abbr|aux|pl)\.?\s*[)）\]]?[\s、.,;]*\s*/i, '').trim();
  if (garbled) {
    // 乱码音标可能残留碎片挂在中文前面，去掉开头的孤立符号
    cn = cn.replace(/^[\s\-\uE000-\uF8FF\uFFFD.·,;:]+/, '').trim();
  }

  if (!en || !/[A-Za-z]/.test(en)) return null;
  if (en.split(/\s+/).length > 40) return null;                          // 太长 → 课文正文
  if (!cn && !ph && !/^[A-Za-z][A-Za-z\-'’\s.]{0,60}$/.test(en)) return null;
  return { en: en, ph: ph, cn: cn, garbled: garbled && !ph };
}

async function importPdfFile(file) {
  const st = importState;
  if (!st) return;
  st.pdfBusy = true;
  st.pdfReport = '正在加载 PDF 解析库…';
  renderBulkImport();
  try {
    const lib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
    const total = doc.numPages || 0;
    const limited = Math.min(total, PDF_MAX_PAGES);
    let chars = 0;
    const lines = [];
    for (let p = 1; p <= limited; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      (tc.items || []).forEach(function (it) { chars += (it && it.str ? it.str.length : 0); });
      pdfItemsToLines(tc.items).forEach(function (l) { lines.push(l); });
      if (p % 5 === 0 || p === limited) {
        st.pdfReport = '正在解析第 ' + p + '/' + limited + ' 页…';
        renderBulkImport();
      }
      if (p % 20 === 0) await new Promise(r => setTimeout(r, 0));   // 让出主线程，界面不假死
    }
    const entries = [];
    let garbled = 0;
    lines.forEach(function (l) {
      const e = parsePdfEntryLine(l);
      if (e) { entries.push(e); if (e.garbled) garbled++; }
    });
    st.text = ['word\tphonetic\tmeaning'].concat(
      entries.map(function (e) { return [e.en, e.ph, e.cn].join('\t'); })
    ).join('\n');
    st.delim = '\t';
    st.header = true;
    st.headerTouched = true;
    parseImportText();

    const thin = total > 0 && chars < total * 20;
    if (!entries.length) {
      st.pdfReport = thin
        ? '这个 PDF 几乎没有文本层（多半是扫描件 / 图片版），浏览器里无法 OCR。请先用 PDF 工具的 OCR 功能另存为文本版，或改用 CSV 导入。'
        : '没有识别出「英文 + 音标 / 中文」的词条排版。可在下方文本框手动整理，或调整列映射后再导入。';
    } else {
      st.pdfReport = '已从 ' + limited + ' 页提取 ' + entries.length + ' 条';
      if (garbled) st.pdfReport += '，其中 ' + garbled + ' 条音标是乱码（教材专用字体所致）已留空';
      if (total > limited) st.pdfReport += '；文件共 ' + total + ' 页，本次只解析前 ' + limited + ' 页';
      if (thin) st.pdfReport += '。注意文本量偏少，可能是扫描件，请核对下方预览';
      st.pdfReport += '。确认无误后再点「确认导入」';
    }
    const needPh = st.rows.filter(function (r) { return !r.ph; }).length;
    st.autoFillPh = needPh > 0;
    st.pdfNeedPh = needPh;
  } catch (e) {
    st.pdfReport = 'PDF 解析失败：' + (e && e.message ? e.message : String(e));
    st.pdfNeedPh = 0;
    st.autoFillPh = false;
  } finally {
    st.pdfBusy = false;
    renderBulkImport();
  }
}

/* ---------- 批量导入：CSV / TXT 单词表 ---------- */
// 借鉴 Anki 的导入设计：分隔符自动识别 → 表头识别 → 列映射 → 先预览再确认
let importState = null;

function splitRow(line, d) {
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (!inQ && c === d) {
      out.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function splitBySpace(line) {
  let parts = line.split(/\t+/);
  if (parts.length < 2) parts = line.split(/\s{2,}/);
  if (parts.length < 2) {
    const toks = line.trim().split(/\s+/);
    if (toks.length <= 2) {
      parts = toks;
    } else {
      // 多个空格分隔时，最后一个「含中文」的词块当作中文列，前面整段当作英文
      let cut = -1;
      for (let i = toks.length - 1; i >= 0; i--) {
        if (/[\u4e00-\u9fff]/.test(toks[i])) { cut = i; break; }
      }
      parts = cut > 0
        ? [toks.slice(0, cut).join(' '), toks.slice(cut).join(' ')]
        : [toks[0], toks.slice(1).join(' ')];
    }
  }
  return parts.map(s => s.trim());
}

function detectDelim(lines) {
  const sample = lines.slice(0, 12);
  const cands = ['\t', ',', ';', '|'];
  let best = null, bestScore = 0;
  cands.forEach(d => {
    const counts = sample.map(l => l.split(d).length - 1);
    const withIt = counts.filter(n => n > 0).length;
    if (!withIt) return;
    const min = Math.min.apply(null, counts.filter(n => n > 0));
    const score = withIt * 100 + min;
    if (score > bestScore) { bestScore = score; best = d; }
  });
  if (best) return best;
  return sample.some(l => /\s/.test(l.trim())) ? 'space' : ',';
}

function looksLikeHeader(cells) {
  return cells.some(c => /^(en|english|word|words|term|phrase|vocab|单词|英文|phonetic|ipa|音标|cn|zh|chinese|中文|释义|意思|meaning|translation|翻译)/i.test(String(c).trim()));
}

function autoMap(headerCells, hasHeader, sampleRow) {
  let en = 0, ph = -1, cn = 1;
  const row = hasHeader ? headerCells : (sampleRow || []);
  if (hasHeader) {
    row.forEach((c, i) => {
      const s = String(c).toLowerCase();
      if (/^(en|english|word|words|term|phrase|vocab|单词|英文)/.test(s)) en = i;
      else if (/^(phonetic|ipa|音标|发音|pron)/.test(s)) ph = i;
      else if (/^(cn|zh|chinese|中文|释义|意思|meaning|translation|翻译)/.test(s)) cn = i;
    });
  } else {
    // 无表头：第二列看着像音标（/.../ 或 [...]）就当成音标列
    const n = row.length;
    if (n >= 2 && /^[/[]/.test(String(row[1] || '').trim())) { ph = 1; cn = n >= 3 ? 2 : -1; }
    else if (n >= 3) { cn = 1; }
  }
  return { en: en, ph: ph, cn: cn };
}

function parseImportText() {
  const st = importState;
  const lines = st.text.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim() !== '');
  if (!lines.length) { st.cells = []; st.rows = []; st.delimUsed = 'auto'; return; }
  const delim = (st.delim === 'auto') ? detectDelim(lines) : st.delim;
  st.delimUsed = delim;
  let cells = lines.map(l => (delim === 'space' ? splitBySpace(l) : splitRow(l, delim)));
  if (!st.headerTouched) st.header = looksLikeHeader(cells[0] || []);
  const dataCells = st.header ? cells.slice(1) : cells;
  st.headerCells = cells[0] || [];
  st.cells = dataCells;
  st.map = autoMap(st.headerCells, st.header, dataCells[0]);
  rebuildImportRows();
}

function rebuildImportRows() {
  const st = importState;
  st.rows = (st.cells || []).map(c => ({
    en: st.map.en >= 0 ? (c[st.map.en] || '') : '',
    ph: st.map.ph >= 0 ? (c[st.map.ph] || '') : '',
    cn: st.map.cn >= 0 ? (c[st.map.cn] || '') : ''
  })).filter(r => r.en);
}

function importScope() {
  const st = importState;
  const tb = textbooks[st.tb];
  return { tbId: tb.id, vol: tb.hasVolumes ? st.vol : null, ci: st.ci, ui: st.ui };
}

function importRowsWithState() {
  const st = importState;
  const sc = importScope();
  const unit = getUnitByScope(sc.tbId, sc.vol, sc.ci, sc.ui) || { words: [], sentences: [] };
  const exist = new Set(unit.words.map(w => String(w.word || '').toLowerCase()));
  const existS = new Set(unit.sentences.map(s => String(s.en || '').toLowerCase()));
  return st.rows.map(r => {
    const isSentence = st.kind === 'sentence' || (st.kind === 'auto' && /[.!?]$/.test(r.en) && r.en.split(/\s+/).length >= 4);
    return {
      en: r.en, ph: r.ph, cn: r.cn, sentence: isSentence,
      dup: isSentence ? existS.has(r.en.toLowerCase()) : exist.has(r.en.toLowerCase())
    };
  });
}

function openBulkImport() {
  closeBulkImport();
  const panel = !!document.getElementById('manage-panel');
  importState = {
    tb: panel ? manageState.tb : currentTextbook,
    vol: panel ? manageState.vol : currentVolume,
    ci: panel ? manageState.ci : (currentChapter === null ? 0 : currentChapter),
    ui: panel ? manageState.ui : (currentUnit === null ? 0 : currentUnit),
    delim: 'auto', header: true, headerTouched: false, kind: 'auto',
    text: '', cells: null, rows: [], map: { en: 0, ph: -1, cn: 1 },
    pdfBusy: false, pdfReport: '', pdfNeedPh: 0, autoFillPh: false
  };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'bulk-import';
  overlay.innerHTML = `<div class="modal-card" id="bulk-import-card" onclick="event.stopPropagation()"></div>`;
  overlay.addEventListener('click', closeBulkImport);
  overlay._onKey = function (e) { if (e.key === 'Escape') closeBulkImport(); };
  document.addEventListener('keydown', overlay._onKey);
  document.body.appendChild(overlay);
  renderBulkImport();
}

function closeBulkImport() {
  const m = document.getElementById('bulk-import');
  if (m) {
    if (m._onKey) document.removeEventListener('keydown', m._onKey);
    m.remove();
  }
  importState = null;
}

function renderBulkImport() {
  const card = document.getElementById('bulk-import-card');
  if (!card || !importState) return;
  const st = importState;
  const tb = textbooks[st.tb];
  const units = getUnitsOf(st.tb, st.vol);
  const chapter = units[st.ci] || units[0];
  const cols = (st.cells && st.cells.length) ? Math.max.apply(null, st.cells.map(c => c.length)) : 0;
  const colOpts = sel => {
    let s = `<option value="-1" ${sel === -1 ? 'selected' : ''}>（无）</option>`;
    for (let i = 0; i < cols; i++) s += `<option value="${i}" ${i === sel ? 'selected' : ''}>第 ${i + 1} 列</option>`;
    return s;
  };
  const delimLabel = { auto: '自动识别', ',': '逗号 ,', ';': '分号 ;', '\t': '制表符 Tab', '|': '竖线 |', space: '空格' };
  const parsed = st.cells !== null;
  const preview = parsed ? importRowsWithState() : [];
  const okCount = preview.filter(r => !r.dup).length;
  const needPh = parsed ? preview.filter(r => !r.dup && !r.sentence && !r.ph).length : (st.pdfNeedPh || 0);

  card.innerHTML = `
    <h3>批量导入单词 / 短语 / 句子</h3>
    <div class="modal-sub">支持 CSV / TXT / PDF：CSV 每行一条，列之间用逗号、制表符、分号或竖线分隔，也可从 Excel 复制粘贴；PDF 在本机读取文本层，自动拆成「英文 / 音标 / 中文」，不会上传</div>

    <div class="mg-field">
      <label>选择文件（.csv / .txt / .tsv / .pdf）</label>
      <input type="file" id="imp-file" accept=".csv,.txt,.tsv,.pdf,text/csv,text/plain,application/pdf" onchange="onImportFile(this)" ${st.pdfBusy ? 'disabled' : ''}>
    </div>

    ${st.pdfReport ? `<div class="mg-status pdf-report${st.pdfBusy ? ' busy' : ''}">${st.pdfBusy ? '<span class="spinner"></span>' : ''}${escHtml(st.pdfReport)}</div>` : ''}

    ${needPh ? `
      <div class="mg-field">
        <label style="display:flex;align-items:center;gap:8px;color:var(--text)">
          <input type="checkbox" style="width:auto" ${st.autoFillPh ? 'checked' : ''} onchange="importState.autoFillPh=this.checked; renderBulkImport();">
          音标缺失的 ${needPh} 条，导入时联网自动补齐（全部查一遍，可中途停止）
        </label>
      </div>` : ''}

    <div class="mg-field">
      <label>或直接粘贴内容</label>
      <textarea id="imp-text" rows="7" placeholder="alarm clock,/əˈlɑːrm klɑːk/,闹钟&#10;make up,/meɪk ʌp/,化妆" oninput="importState.text=this.value">${escHtml(st.text)}</textarea>
    </div>

    <div class="imp-grid">
      <div class="mg-field">
        <label>分隔符</label>
        <select id="imp-delim" onchange="importState.delim=this.value; parseImportText(); renderBulkImport();">
          ${Object.keys(delimLabel).map(k => `<option value="${k}" ${st.delim === k ? 'selected' : ''}>${delimLabel[k]}</option>`).join('')}
        </select>
      </div>
      <div class="mg-field">
        <label>导入为</label>
        <select id="imp-kind" onchange="importState.kind=this.value; renderBulkImport();">
          <option value="auto" ${st.kind === 'auto' ? 'selected' : ''}>自动判断（长句 → 句子）</option>
          <option value="word" ${st.kind === 'word' ? 'selected' : ''}>单词 / 短语</option>
          <option value="sentence" ${st.kind === 'sentence' ? 'selected' : ''}>句子</option>
        </select>
      </div>
    </div>

    <div class="mg-field">
      <label style="display:flex;align-items:center;gap:8px;color:var(--text)">
        <input type="checkbox" style="width:auto" ${st.header ? 'checked' : ''} onchange="importState.headerTouched=true; importState.header=this.checked; parseImportText(); renderBulkImport();">
        首行是表头${parsed && st.delimUsed ? `（已按「${delimLabel[st.delimUsed] || st.delimUsed}」解析，共 ${st.cells.length} 行）` : ''}
      </label>
    </div>

    ${parsed && cols ? `
      <div class="imp-grid">
        <div class="mg-field"><label>英文列</label><select onchange="importState.map.en=parseInt(this.value); rebuildImportRows(); renderBulkImport();">${colOpts(st.map.en)}</select></div>
        <div class="mg-field"><label>音标列</label><select onchange="importState.map.ph=parseInt(this.value); rebuildImportRows(); renderBulkImport();">${colOpts(st.map.ph)}</select></div>
        <div class="mg-field"><label>中文列</label><select onchange="importState.map.cn=parseInt(this.value); rebuildImportRows(); renderBulkImport();">${colOpts(st.map.cn)}</select></div>
        <div class="mg-field"><label>导入到单元</label>
          <select onchange="onImportUnitChange(this.value)">
            ${units.map((c, i) => `<option value="${i}" ${i === st.ci ? 'selected' : ''}>${c.chapter}: ${c.title}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="mg-field">
        <label>单元</label>
        <select onchange="importState.ui=parseInt(this.value); renderBulkImport();">
          ${chapter.units.map((u, i) => `<option value="${i}" ${i === st.ui ? 'selected' : ''}>${u.title}</option>`).join('')}
        </select>
      </div>
      <div class="mg-field">
        <label>预览（前 10 条，共 ${st.rows.length} 条，可导入 ${okCount} 条）</label>
        <div class="imp-preview">
          <table class="imp-table">
            <tr><th style="width:28px">#</th><th>英文</th><th>音标</th><th>中文</th></tr>
            ${preview.slice(0, 10).map((r, i) => `<tr>
              <td>${i + 1}</td>
              <td class="${r.dup ? 'dup' : ''}">${escHtml(r.en)}${r.dup ? '（已存在）' : ''}</td>
              <td>${escHtml(r.ph)}</td>
              <td>${escHtml(r.cn)}</td>
            </tr>`).join('')}
          </table>
        </div>
      </div>
    ` : ''}

    <div class="mg-status" id="imp-status">${st.importing ? `正在联网补齐音标 ${st.fillDone || 0}/${st.fillTotal || needPh}（已补齐 ${st.fillHit || 0} 个）…` : (parsed ? (st.rows.length ? `解析到 ${st.rows.length} 条，其中 ${okCount} 条可导入${needPh ? `，${needPh} 条缺音标` : ''}` : '没有解析出内容，请检查分隔符或列映射') : '粘贴内容或选择文件后点击「解析预览」')}</div>
    <div class="modal-ops">
      <button class="btn btn-primary" onclick="parseImportText(); renderBulkImport();" ${st.pdfBusy || st.importing ? 'disabled' : ''}>解析预览</button>
      <button class="btn btn-primary" onclick="confirmBulkImport()" ${(!okCount || st.pdfBusy || st.importing) ? 'disabled' : ''}>${st.importing ? '正在补齐音标…' : '确认导入 ' + (okCount ? '(' + okCount + ')' : '')}</button>
      ${st.importing
        ? `<button class="btn" onclick="importState.fillStop=true">停止补齐</button>`
        : `<button class="btn" onclick="closeBulkImport()">取消</button>`}
    </div>`;
}

function onImportFile(input) {
  const f = input.files && input.files[0];
  if (!f || !importState) return;
  if (/\.pdf$/i.test(f.name || '') || f.type === 'application/pdf') {
    importPdfFile(f).catch(function () { /* 失败原因已在面板里提示 */ });
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    importState.text = String(reader.result || '');
    importState.headerTouched = false;
    parseImportText();
    renderBulkImport();
  };
  reader.readAsText(f, 'utf-8');
  input.value = '';
}

function onImportUnitChange(ci) {
  importState.ci = parseInt(ci);
  importState.ui = 0;
  renderBulkImport();
}

// 逐批联网补齐音标。limit=0 表示不限条数；onProgress(已查, 总数, 已补齐)；shouldStop() 返回 true 时中断
async function fillMissingPhonetics(rows, limit, opts) {
  opts = opts || {};
  const getEn = opts.getEn || function (r) { return r.en; };
  const setPh = opts.setPh || function (r, p) { r.ph = p; };
  const missing = rows.filter(function (r) { return !r.sentence && !r.ph && String(getEn(r) || '').trim(); });
  const list = limit ? missing.slice(0, limit) : missing;
  if (!list.length) return 0;
  let done = 0, hit = 0;
  const win = [];        // 最近若干次查询的成败，用来判断网络是否根本不通
  const WIN = 12, WIN_FAIL = 10;
  const CONC = 6;
  for (let i = 0; i < list.length; i += CONC) {
    if (opts.shouldStop && opts.shouldStop()) break;
    const batch = list.slice(i, i + CONC);
    const res = await Promise.all(batch.map(function (r) {
      return fetchPhoneticUS(getEn(r)).catch(function () { return ''; });
    }));
    res.forEach(function (ph, k) {
      if (ph) setPh(batch[k], ph);
      win.push(ph ? 1 : 0);
      if (win.length > WIN) win.shift();
    });
    hit += res.filter(Boolean).length;
    done += batch.length;
    // 最近 12 次查询里挂了 10 次，基本可以断定是网络不通（代理没开 / 被墙），
    // 没必要让剩下的上千条继续干等到超时
    if (win.length >= WIN && win.filter(x => !x).length >= WIN_FAIL) {
      if (opts.onDead) { try { opts.onDead(); } catch (e) { /* ignore */ } }
      break;
    }
    if (opts.onProgress) {
      try { opts.onProgress(done, list.length, hit); } catch (e) { /* ignore */ }
    }
  }
  return hit;
}

async function confirmBulkImport() {
  const st = importState;
  if (!st) return;
  const rows = importRowsWithState().filter(r => !r.dup && r.en);
  if (!rows.length) return;

  let filled = 0;
  const need = rows.filter(function (r) { return !r.sentence && !r.ph; }).length;
  if (st.autoFillPh && need) {
    st.importing = true;
    st.fillStop = false;
    st.fillDone = 0;
    st.fillTotal = need;
    renderBulkImport();
    filled = await fillMissingPhonetics(rows, 0, {
      onProgress: function (done, total, hit) {
        st.fillDone = done;
        st.fillHit = hit;
        const el = document.getElementById('imp-status');
        if (el) el.textContent = `正在联网补齐音标 ${done}/${total}（已补齐 ${hit} 个）…`;
      },
      shouldStop: function () { return !!st.fillStop; },
      onDead: function () { st.netDead = true; }
    });
    st.importing = false;
    if (st.fillStop) toast(`已停止补齐，已补到 ${filled} 个音标，未补齐的稍后可在内容管理里继续`);
    else if (st.netDead) toast(`网络查询中断，只补到 ${filled} 个音标。请检查网络/代理后，可在内容管理点「联网补齐音标」继续`, 6000);
  }

  const scope = importScope();
  await saveUnitPatch(scope, doc => {
    rows.forEach(r => {
      if (r.sentence) {
        doc.sentences.push({ orig: newItemKey(), en: r.en, cn: r.cn, deleted: false });
      } else {
        doc.words.push({
          orig: newItemKey(), word: r.en, phonetic: r.ph || '', meaning: r.cn || '',
          examples: [], type: /\s/.test(r.en) ? 'phrase' : 'word', deleted: false
        });
      }
    });
  });
  const skipped = st.rows.length - rows.length;
  closeBulkImport();
  toast(`已导入 ${rows.length} 条${filled ? `（自动补齐音标 ${filled} 个）` : ''}${skipped ? `，跳过 ${skipped} 条重复` : ''}`);
  refreshAfterContentChange();
}

init();
