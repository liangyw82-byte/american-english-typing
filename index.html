<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>美国人每天说的话 - 打字练习</title>
<style>
:root {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-hover: #252937;
  --bg-input: #1e2130;
  --text: #e4e4e7;
  --text-dim: #9ca3af;
  --text-faint: #6b7280;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-dim: #4f46e5;
  --success: #22c55e;
  --error: #ef4444;
  --warning: #f59e0b;
  --border: #2d3142;
  --border-light: #373b4d;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: calc(var(--app-height, 100vh));
  display: flex;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
}

button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Sidebar */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: calc(var(--app-height, 100vh));
  position: sticky;
  top: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-hover);
  margin-bottom: 4px;
}

.sidebar-header p {
  font-size: 12px;
  color: var(--text-faint);
}

.sidebar-stats {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 16px;
  font-size: 12px;
}

.stat-item { color: var(--text-dim); }
.stat-item span { color: var(--accent-hover); font-weight: 600; font-size: 14px; }

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.sidebar-nav::-webkit-scrollbar { width: 6px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

.chapter-item { margin-bottom: 2px; }

.chapter-header {
  padding: 10px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  user-select: none;
}

.chapter-header:hover { background: var(--bg-hover); }
.chapter-header .arrow {
  width: 12px; height: 12px;
  transition: transform 0.2s;
  flex-shrink: 0;
  color: var(--text-faint);
}
.chapter-item.expanded .chapter-header .arrow { transform: rotate(90deg); }

.chapter-progress {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 400;
}

.unit-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.chapter-item.expanded .unit-list { max-height: 600px; }

.unit-item {
  padding: 8px 20px 8px 44px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.unit-item:hover { background: var(--bg-hover); color: var(--text); }
.unit-item.active { background: var(--accent-dim); color: #fff; }
.unit-item .unit-check {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--border-light);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
}
.unit-item.completed .unit-check {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.unit-item.completed .unit-check::after { content: '\2713'; }

/* Main content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: calc(var(--app-height, 100vh));
  overflow: hidden;
  min-width: 0;
}

.topbar {
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
}

.topbar-left { display: flex; align-items: center; gap: 16px; }

.breadcrumb {
  font-size: 13px;
  color: var(--text-dim);
}
.breadcrumb span { color: var(--text); font-weight: 600; }

.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-input);
  border-radius: 8px;
  padding: 3px;
}

.mode-tab {
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-dim);
  transition: all 0.15s;
  border: none;
  background: none;
}
.mode-tab:hover { color: var(--text); }
.mode-tab.active {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

/* Practice area */
.practice-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  overflow-y: auto;
}

.welcome-screen {
  text-align: center;
  max-width: 600px;
}

.welcome-screen h2 {
  font-size: 28px;
  margin-bottom: 12px;
  color: var(--text);
}

.welcome-screen p {
  color: var(--text-dim);
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 24px;
}

.welcome-features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 32px;
}

.feature-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: left;
}

.feature-card .icon { font-size: 28px; margin-bottom: 8px; }
.feature-card h3 { font-size: 14px; margin-bottom: 4px; }
.feature-card p { font-size: 12px; color: var(--text-faint); margin: 0; }

.btn-start {
  padding: 14px 40px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-start:hover { background: var(--accent-hover); transform: translateY(-1px); }

/* Typing practice */
.practice-container {
  width: 100%;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.progress-bar-container {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s ease;
  width: 0%;
}

.word-display {
  font-size: 48px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 2px;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0;
}

.char {
  position: relative;
  transition: color 0.1s;
  padding: 0 1px;
}
.char.correct { color: var(--success); }
.char.incorrect { color: var(--error); background: rgba(239,68,68,0.15); border-radius: 2px; }
.char.pending { color: var(--text-faint); }
.char.current {
  color: var(--accent-hover);
  border-bottom: 3px solid var(--accent);
  border-radius: 2px;
}

.word-info {
  text-align: center;
  margin-bottom: 24px;
  min-height: 28px;
}

.phonetic {
  font-size: 18px;
  color: var(--text-dim);
  font-family: 'Segoe UI', Arial, sans-serif;
}

.translation {
  font-size: 16px;
  color: var(--text-dim);
  margin-top: 4px;
}

.sentence-display {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
  text-align: center;
}

.sentence-english {
  font-size: 24px;
  line-height: 1.6;
  margin-bottom: 12px;
  font-weight: 500;
}

.sentence-chinese {
  font-size: 15px;
  color: var(--text-faint);
}

.input-area {
  width: 100%;
  position: relative;
  margin-bottom: 16px;
}

.typing-input {
  width: 100%;
  padding: 16px 20px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 20px;
  font-family: 'Courier New', monospace;
  outline: none;
  transition: border-color 0.2s;
}
.typing-input:focus { border-color: var(--accent); }
.typing-input.incorrect { border-color: var(--error); }
.typing-input::placeholder { color: var(--text-faint); }

.stats-row {
  display: flex;
  gap: 32px;
  margin-bottom: 24px;
  justify-content: center;
}

.stat-box {
  text-align: center;
}

.stat-box .value {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-hover);
}

.stat-box .label {
  font-size: 12px;
  color: var(--text-faint);
  margin-top: 2px;
}

.action-row {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.btn {
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }

/* Result screen */
.result-screen {
  text-align: center;
  max-width: 500px;
}

.result-screen h2 {
  font-size: 24px;
  margin-bottom: 24px;
}

.result-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 32px;
}

.result-stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.result-stat .value { font-size: 32px; font-weight: 700; }
.result-stat .label { font-size: 13px; color: var(--text-faint); margin-top: 4px; }

/* Word list */
.word-list-overlay {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  justify-content: center;
}

.word-chip {
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 12px;
  border: 1px solid var(--border);
  color: var(--text-faint);
  background: var(--bg-card);
}
.word-chip.active {
  border-color: var(--accent);
  color: var(--accent-hover);
  background: rgba(99,102,241,0.1);
}
.word-chip.done {
  border-color: var(--success);
  color: var(--success);
}
.word-chip.wrong {
  border-color: var(--error);
  color: var(--error);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-dim); }

/* Dictation mode */
.dictation-prompt {
  font-size: 18px;
  color: var(--text-dim);
  margin-bottom: 20px;
  text-align: center;
}
.dictation-prompt .listening-icon {
  font-size: 64px;
  display: block;
  margin-bottom: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.1); }
}
.dictation-hidden {
  font-size: 48px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 2px;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  color: var(--text);
}
.dictation-hidden.dictation-sentence {
  font-size: 24px;
  line-height: 1.6;
  letter-spacing: 1px;
}
.dictation-blank {
  font-size: 48px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  letter-spacing: 4px;
}
.audio-controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 20px;
}
.btn-audio {
  padding: 12px 28px;
  border-radius: var(--radius);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid var(--accent);
  background: rgba(99,102,241,0.1);
  color: var(--accent-hover);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
.btn-audio:hover { background: rgba(99,102,241,0.2); transform: translateY(-1px); }
.btn-audio.playing {
  background: var(--accent);
  color: #fff;
}
.btn-reveal {
  padding: 12px 28px;
  border-radius: var(--radius);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid var(--border-light);
  background: var(--bg-card);
  color: var(--text-dim);
  font-weight: 600;
}
.btn-reveal:hover { background: var(--bg-hover); color: var(--text); }
.dictation-hint {
  font-size: 13px;
  color: var(--text-faint);
  text-align: center;
  margin-bottom: 16px;
}
.dictation-result-timer {
  font-size: 14px;
  color: var(--accent-hover);
  text-align: center;
  margin-top: 8px;
  font-weight: 600;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
}
.btn-primary:hover { background: var(--accent-hover); }

/* Mobile menu button */
.mobile-menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background 0.15s;
}
.mobile-menu-btn:hover { background: var(--bg-hover); }

.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    width: 80%;
    max-width: 280px;
    min-width: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar.open ~ .sidebar-overlay {
    display: block;
  }
  .mobile-menu-btn { display: block; min-height: 44px; min-width: 44px; }
  .topbar {
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    flex-wrap: wrap;
    gap: 8px;
  }
  .topbar-left {
    flex: 1;
    min-width: 0;
  }
  .breadcrumb {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mode-tabs {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .mode-tab {
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
    min-height: 36px;
  }
  .practice-area {
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .word-display {
    font-size: 28px;
    letter-spacing: 1px;
  }
  .dictation-hidden {
    font-size: 28px;
    letter-spacing: 1px;
  }
  .dictation-hidden.dictation-sentence {
    font-size: 16px;
  }
  .sentence-english { font-size: 16px; }
  .sentence-chinese { font-size: 13px; }
  .typing-input {
    font-size: 16px;
    padding: 12px 14px;
    min-height: 48px;
  }
  .stats-row {
    gap: 12px;
  }
  .stat-box { min-height: 52px; }
  .stat-box .value { font-size: 20px; }
  .stat-box .label { font-size: 11px; }
  .welcome-screen h2 { font-size: 22px; }
  .welcome-screen p { font-size: 13px; }
  .welcome-features {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .feature-card { padding: 14px; }
  .feature-card .icon { font-size: 22px; }
  .btn-start {
    padding: 14px 32px;
    font-size: 15px;
    min-height: 48px;
  }
  .btn {
    padding: 10px 18px;
    font-size: 13px;
    min-height: 44px;
  }
  .btn-audio, .btn-reveal {
    padding: 12px 20px;
    font-size: 14px;
    min-height: 48px;
  }
  .word-chip {
    padding: 4px 10px;
    font-size: 11px;
    min-width: 28px;
    min-height: 24px;
  }
  .dictation-prompt {
    font-size: 15px;
  }
  .dictation-prompt .listening-icon {
    font-size: 48px;
  }
  .result-stats {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .result-stat { padding: 14px; }
  .result-stat .value { font-size: 24px; }
  .result-stat .label { font-size: 11px; }
  .action-row {
    flex-wrap: wrap;
  }
  .progress-bar-container { margin-bottom: 20px; }
  .login-card {
    padding: 28px 24px;
    margin: 16px;
    max-width: none;
  }
  .btn-login { min-height: 48px; }
  .login-field input {
    min-height: 48px;
    font-size: 16px;
  }
  .btn-resume { min-height: 48px; }
}

/* Login Screen */
.login-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  width: 100%; max-width: 400px;
  box-shadow: var(--shadow);
}
.login-card h2 { font-size: 22px; margin-bottom: 8px; }
.login-card .subtitle { font-size: 13px; color: var(--text-faint); margin-bottom: 24px; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
.login-field input {
  width: 100%; padding: 12px 14px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: 8px;
  color: var(--text); font-size: 15px;
  outline: none; transition: border-color 0.2s;
}
.login-field input:focus { border-color: var(--accent); }
.login-error { color: var(--error); font-size: 13px; margin-bottom: 12px; display: none; }
.btn-login {
  width: 100%; padding: 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  margin-bottom: 12px;
}
.btn-login:hover { background: var(--accent-hover); }
.login-switch { text-align: center; font-size: 13px; color: var(--text-dim); }
.login-switch a { color: var(--accent-hover); cursor: pointer; text-decoration: none; }

/* User info in sidebar */
.user-info {
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.user-email { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.btn-logout { font-size: 11px; color: var(--text-faint); background: none; border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn-logout:hover { color: var(--error); border-color: var(--error); }

/* 错题集 button */
.btn-wrong-items {
  margin: 8px 20px;
  padding: 10px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; transition: all 0.15s;
}
.btn-wrong-items:hover { background: var(--bg-hover); color: var(--text); }
.btn-wrong-items .badge {
  background: var(--error); color: #fff;
  font-size: 11px; padding: 2px 7px;
  border-radius: 10px; font-weight: 600;
}
.btn-wrong-items .badge.empty { background: var(--border-light); }

/* Resume button */
.btn-resume {
  display: block; margin: 0 auto 16px;
  padding: 12px 32px;
  background: var(--success); color: #fff;
  border: none; border-radius: var(--radius);

// ======================== USER AUTH ========================
let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
let users = JSON.parse(localStorage.getItem('users') || '[]');
let isRegisterMode = false;

function showLoginScreen() {
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('login-email').focus();
}

function hideLoginScreen() {
  document.getElementById('login-overlay').style.display = 'none';
}

function toggleLoginRegister() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('field-name').style.display = isRegisterMode ? 'block' : 'none';
  document.getElementById('login-title').textContent = isRegisterMode ? '注册' : '登录';
  document.getElementById('login-subtitle').textContent = isRegisterMode ? '创建账号后即可保存学习进度' : '登录后您的学习进度将被保存';
  document.getElementById('btn-login-action').textContent = isRegisterMode ? '注册' : '登录';
  document.getElementById('login-switch-text').textContent = isRegisterMode ? '已有账号？' : '没有账号？';
  document.querySelector('.login-switch a').textContent = isRegisterMode ? '登录' : '注册';
  document.getElementById('login-error').style.display = 'none';
}

function handleLoginAction() {
  warmUpSpeech();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const name = document.getElementById('login-name').value.trim();
  const errEl = document.getElementById('login-error');

  if (!email || !password) {
    errEl.textContent = '请填写邮箱和密码';
    errEl.style.display = 'block';
    return;
  }

  if (isRegisterMode) {
    if (!name) {
      errEl.textContent = '请填写昵称';
      errEl.style.display = 'block';
      return;
    }
    if (users.find(u => u.email === email)) {
      errEl.textContent = '该邮箱已注册，请直接登录';
      errEl.style.display = 'block';
      return;
    }
    const user = { email, password, name, createdAt: Date.now() };
    users.push(user);
    localStorage.setItem('users', JSON.stringify(users));
    currentUser = user;
    localStorage.setItem('currentUser', JSON.stringify(user));
    hideLoginScreen();
    afterLogin();
  } else {
    const user = users.find(u => u.email === email && u.password === password);
    if (!user) {
      errEl.textContent = '邮箱或密码错误';
      errEl.style.display = 'block';
      return;
    }
    currentUser = user;
    localStorage.setItem('currentUser', JSON.stringify(user));
    hideLoginScreen();
    afterLogin();
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('currentUser');
  showLoginScreen();
  document.getElementById('user-info').style.display = 'none';
}

function afterLogin() {
  document.getElementById('user-info').style.display = 'flex';
  document.getElementById('user-email-display').textContent = currentUser.email;
  initDB().then(() => {
    restoreProgress();
    updateWrongBadge();
  });
}

// ======================== INDEXEDB ========================
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('typing_practice', 2);
    request.onupgradeneeded = function(e) {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('progress')) {
        database.createObjectStore('progress', { keyPath: 'email' });
      }
      if (!database.objectStoreNames.contains('wrongItems')) {
        const store = database.createObjectStore('wrongItems', { keyPath: 'id' });
        store.createIndex('email', 'email', { unique: false });
      }
    };
    request.onsuccess = function(e) {
      db = e.target.result;
      resolve(db);
    };
    request.onerror = function(e) {
      console.error('IndexedDB error:', e);
      resolve(null);
    };
  });
}

function dbPut(storeName, data) {
  return new Promise((resolve) => {
    if (!db) { resolve(); return; }
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve) => {
    if (!db) { resolve(null); return; }
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve) => {
    if (!db) { resolve([]); return; }
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve) => {
    if (!db) { resolve(); return; }
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}

async function saveProgress() {
  if (!currentUser || !db) return;
  await dbPut('progress', {
    email: currentUser.email,
    chapter: currentChapter,
    unit: currentUnit,
    mode: currentMode,
    index: currentIndex,
    savedAt: Date.now()
  });
}

async function restoreProgress() {
  if (!currentUser || !db) return;
  const p = await dbGet('progress', currentUser.email);
  if (p && p.chapter !== null && p.chapter !== undefined) {
    currentMode = p.mode || 'word';
    updateModeTabs();
    currentChapter = p.chapter;
    currentUnit = p.unit;
    renderWelcome(p);
  } else {
    renderWelcome();
  }
}

// ======================== WRONG ITEMS (错题集) ========================
const CORRECT_THRESHOLD = 3;
let wrongItemsList = [];
let isWrongMode = false;

async function addWrongItem(item) {
  if (!currentUser || !db) return;
  const id = currentUser.email + '|' + item.display;
  const existing = await dbGet('wrongItems', id);
  if (existing) {
    existing.correctCount = 0;
    await dbPut('wrongItems', existing);
  } else {
    await dbPut('wrongItems', {
      id: id,
      email: currentUser.email,
      display: item.display,
      phonetic: item.phonetic || '',
      translation: item.translation || '',
      type: item.type || 'word',
      correctCount: 0,
      addedAt: Date.now()
    });
  }
  await updateWrongBadge();
}

async function incrementWrongCorrect(item) {
  if (!currentUser || !db) return;
  const id = currentUser.email + '|' + item.display;
  const existing = await dbGet('wrongItems', id);
  if (existing) {
    existing.correctCount = (existing.correctCount || 0) + 1;
    if (existing.correctCount >= CORRECT_THRESHOLD) {
      await dbDelete('wrongItems', id);
    } else {
      await dbPut('wrongItems', existing);
    }
    await updateWrongBadge();
  }
}

async function loadWrongItems() {
  if (!currentUser || !db) return [];
  const all = await dbGetAll('wrongItems');
  wrongItemsList = all.filter(w => w.email === currentUser.email);
  return wrongItemsList;
}

async function updateWrongBadge() {
  await loadWrongItems();
  const badge = document.getElementById('wrong-badge');
  if (badge) {
    badge.textContent = wrongItemsList.length;
    badge.classList.toggle('empty', wrongItemsList.length === 0);
  }
}

function openWrongItems() {
  if (currentMode !== 'wrong' && currentChapter !== null) {
    saveProgress();
  }
  currentMode = 'wrong';
  updateModeTabs();
  startPractice();
}

}

          const key = `${ci}-${ui}`;
          const isDone = unitProgress[key] === 'done';
          return `<div class="unit-item ${isDone ? 'completed' : ''}" role="button" tabindex="0" onclick="selectUnit(${ci}, ${ui})">
            <div class="unit-check"></div>
            <span>${unit.title}</span>
          </div>`;
        }).join('')}
      </div>
    `;
    nav.appendChild(chapterDiv);
  });
}

function toggleChapter(ci) {
  const chapters = document.querySelectorAll('.chapter-item');
  chapters[ci].classList.toggle('expanded');
}

async function selectUnit(ci, ui) {
  currentChapter = ci;
  currentUnit = ui;
  isWrongMode = false;
  const chapter = bookData[ci];
  const unit = chapter.units[ui];
  
  document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
  
  const chapterDiv = document.querySelectorAll('.chapter-item')[ci];
  chapterDiv.classList.add('expanded');
  const unitItems = chapterDiv.querySelectorAll('.unit-item');
  unitItems[ui].classList.add('active');
  
  const breadcrumb = document.getElementById('breadcrumb');
  breadcrumb.innerHTML = `${chapter.chapter} > <span>${unit.title}</span>`;

  closeSidebar();
  startPractice();
  saveProgress();
}

// ======================== SPEECH SYNTHESIS ========================
const synth = window.speechSynthesis;
let voicesLoaded = false;
let speechWarmedUp = false;
let currentUtterance = null;

function loadVoices() {
  voicesLoaded = true;
}

if (synth && typeof synth.addEventListener === 'function') {
  synth.addEventListener('voiceschanged', loadVoices);
  // Try multiple times to load voices (some browsers fire onvoiceschanged late)
  const tryLoad = setInterval(() => {
    try {
      if (synth.getVoices().length > 0) {
        voicesLoaded = true;
        clearInterval(tryLoad);
      }
    } catch (e) {
      clearInterval(tryLoad);
    }
  }, 200);
  setTimeout(() => clearInterval(tryLoad), 5000);
  loadVoices();
} else if (synth) {
  try {
    synth.onvoiceschanged = loadVoices;
    loadVoices();
  } catch (e) {
    // ignore
  }
}

function warmUpSpeech() {
  if (speechWarmedUp || !synth || typeof SpeechSynthesisUtterance === 'undefined') return;
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    synth.speak(u);
    speechWarmedUp = true;
  } catch (e) {
    // ignore
  }
}

function getUSVoice() {
  if (!synth) return null;
  const voices = synth.getVoices();
  if (!voices || voices.length === 0) return null;
  const usVoice = voices.find(v => v.lang === 'en-US' && /samantha|google us|david|zira/i.test(v.name))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  return usVoice || null;
}

function speakText(text, rate, onEnd) {
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    if (onEnd) onEnd();
    return;
  }
  try {
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = rate || 0.9;
    utterance.pitch = 1;
    utterance.volume = 1;
    const usVoice = getUSVoice();
    if (usVoice) utterance.voice = usVoice;
    utterance.onend = () => {
      currentUtterance = null;
      if (onEnd) onEnd();
    };
    utterance.onerror = () => {
      currentUtterance = null;
      if (onEnd) onEnd();
    };
    currentUtterance = utterance;
    synth.speak(utterance);
    // Fallback: some browsers don't fire onend reliably
    setTimeout(() => {
      if (currentUtterance === utterance && !synth.speaking) {
        currentUtterance = null;
        if (onEnd) onEnd();
      }
    }, 10000);
  } catch (e) {
    currentUtterance = null;
    if (onEnd) onEnd();
  }
}

// ======================== PRACTICE ========================
async function startPractice(startIndex) {
  if (currentMode === 'wrong') {
    isWrongMode = true;
    await loadWrongItems();
    if (wrongItemsList.length === 0) {
      const area = document.getElementById('practice-area');
      area.innerHTML = `<div class="empty-state"><h3>错题集为空</h3><p>练习中出错的单词或句子会自动加入错题集，连续答对${CORRECT_THRESHOLD}次后移除</p></div>`;
      return;
    }
    practiceItems = wrongItemsList.map(w => ({
      display: w.display,
      phonetic: w.phonetic,
      translation: w.translation,
      type: w.type,
      correctCount: w.correctCount || 0
    }));
    for (let i = practiceItems.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [practiceItems[i], practiceItems[j]] = [practiceItems[j], practiceItems[i]];
    }
    document.getElementById('breadcrumb').innerHTML = `错题集 (<span>${wrongItemsList.length}</span>题)`;
  } else {
    isWrongMode = false;
    if (currentChapter === null) return;
    const unit = bookData[currentChapter].units[currentUnit];

    if (currentMode === 'word') {
      practiceItems = unit.words.map(w => ({
        display: w.word, phonetic: w.phonetic, translation: w.meaning, type: 'word'
      }));
    } else if (currentMode === 'sentence') {
      practiceItems = unit.sentences.map(s => ({
        display: s.en, translation: s.cn, type: 'sentence'
      }));
    } else if (currentMode === 'dictation') {
      practiceItems = [
        ...unit.words.map(w => ({ display: w.word, phonetic: w.phonetic, translation: w.meaning, type: 'word' })),
        ...unit.sentences.map(s => ({ display: s.en, translation: s.cn, type: 'sentence' }))
      ];
    }
  }

  currentIndex = startIndex || 0;
  practiceStartTime = null;
  totalKeystrokes = 0;
  correctKeystrokes = 0;
  incorrectChars = 0;
  currentErrors = 0;
  currentItemHadError = false;
  dictationRevealed = false;
  dictationSubmitted = false;
  isTransitioning = false;

  renderPractice();
}

function renderPractice() {
  const area = document.getElementById('practice-area');
  
  if (practiceItems.length === 0) {
    area.innerHTML = `<div class="empty-state"><h3>暂无练习内容</h3><p>请选择其他单元</p></div>`;
    return;
  }
  
  if (currentIndex >= practiceItems.length) {
    renderResults();
    return;
  }
  
  const item = practiceItems[currentIndex];
  const progress = ((currentIndex / practiceItems.length) * 100).toFixed(0);
  
  let chipsHtml = practiceItems.map((_, i) => {
    let cls = '';
    if (i < currentIndex) cls = 'done';
    else if (i === currentIndex) cls = 'active';
    return `<div class="word-chip ${cls}">${i + 1}</div>`;
  }).join('');

  let wrongInfoHtml = '';
  if (isWrongMode && item.correctCount !== undefined) {
    const remaining = CORRECT_THRESHOLD - item.correctCount;
    wrongInfoHtml = `<div class="correct-count-info">还需连续答对 <span>${remaining}</span> 次即可移除</div>`;
  }

  area.innerHTML = `
    <div class="practice-container">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" style="width: ${progress}%"></div>
      </div>
      <div class="word-list-overlay">${chipsHtml}</div>
      ${wrongInfoHtml}
      ${currentMode === 'dictation' || isWrongMode ? `
        <div class="dictation-prompt">
          <span class="listening-icon">\ud83c\udfa7</span>
          \u542c\u97f3\u9010\u5b57\u6253\u51fa\u4f60\u542c\u5230\u7684\u5185\u5bb9
        </div>
        <div class="dictation-hidden ${item.type === 'sentence' ? 'dictation-sentence' : ''}" id="dictation-display"></div>
        <div class="word-info" id="dictation-info" style="display:none">
          <div class="phonetic">${item.phonetic || ''}</div>
          <div class="translation">${item.translation || ''}</div>
        </div>
        <div class="audio-controls">
          <button class="btn-audio" id="btn-play" onclick="playCurrentAudio()">
            \ud83d\udd0a \u64ad\u653e\u53d1\u97f3
          </button>
          <button class="btn-reveal" id="btn-reveal" onclick="revealDictation()">
            \u663e\u793a\u7b54\u6848 (Esc)
          </button>
        </div>
        <div class="dictation-hint">\u70b9\u51fb\u201c\u64ad\u653e\u53d1\u97f3\u201d\u542c\u53d6\uff0c\u8f93\u5165\u540e\u81ea\u52a8\u7ea0\u9519\uff1bEsc \u53ef\u67e5\u770b\u7b54\u6848</div>
      ` : currentMode === 'word' ? `
        <div class="word-display" id="word-display"></div>
        <div class="word-info">
          <div class="phonetic">${item.phonetic || ''}</div>
          <div class="translation">${item.translation || ''}</div>
        </div>
      ` : `
        <div class="sentence-display">
          <div class="sentence-english" id="word-display"></div>
          <div class="sentence-chinese">${item.translation || ''}</div>
        </div>
      `}
      <div class="input-area">
        <input type="text" class="typing-input" id="typing-input"
               placeholder="\u5728\u6b64\u8f93\u5165..." autocomplete="off" autofocus>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="value" id="stat-wpm">0</div><div class="label">WPM</div></div>
        <div class="stat-box"><div class="value" id="stat-acc">100%</div><div class="label">\u6b63\u786e\u7387</div></div>
        <div class="stat-box"><div class="value" id="stat-progress">${currentIndex + 1}/${practiceItems.length}</div><div class="label">\u8fdb\u5ea6</div></div>
      </div>
      <div class="action-row">
        <button class="btn" onclick="skipItem()">\u8df3\u8fc7 (Tab)</button>
        <button class="btn" onclick="restartUnit()">\u91cd\u65b0\u5f00\u59cb</button>
      </div>
    </div>
  `;

  if (currentMode === 'dictation' || isWrongMode) {
    dictationRevealed = false;
    dictationSubmitted = false;
    renderDictationDisplay('');
    setTimeout(() => playCurrentAudio(), 300);
  } else {
    renderWordDisplay('');
  }
  const input = document.getElementById('typing-input');
  input.focus();

  input.addEventListener('input', handleInput);
  input.addEventListener('keydown', handleKeyDown);
}

function renderWordDisplay(typed) {
  const display = document.getElementById('word-display');
  if (!display) return;
  
  const target = practiceItems[currentIndex].display;
  let html = '';
  
  for (let i = 0; i < target.length; i++) {
    let cls = 'pending';
    if (i < typed.length) {
      if (typed[i] === target[i]) {
        cls = 'correct';
      } else {
        cls = 'incorrect';
      }
    } else if (i === typed.length) {
      cls = 'current';
    }
    html += `<span class="char ${cls}">${target[i] === ' ' ? '&nbsp;' : target[i]}</span>`;
  }
  
  if (typed.length > target.length) {
    for (let i = target.length; i < typed.length; i++) {
      html += `<span class="char incorrect">${typed[i]}</span>`;
    }
  }
  
  display.innerHTML = html;
}

function renderDictationDisplay(typed) {
  const display = document.getElementById('dictation-display');
  if (!display) return;

  const target = practiceItems[currentIndex].display;

  if (!dictationRevealed && typed.length === 0) {
    display.innerHTML = '<span style="color:var(--text-faint);letter-spacing:8px">\u2731\u2731\u2731</span>';
    return;
  }

  let html = '';
  if (dictationRevealed) {
    for (let i = 0; i < target.length; i++) {
      let cls = 'pending';
      if (i < typed.length) {
        cls = typed[i] === target[i] ? 'correct' : 'incorrect';
      } else if (i === typed.length) {
        cls = 'current';
      }
      html += `<span class="char ${cls}">${target[i] === ' ' ? '&nbsp;' : target[i]}</span>`;
    }
  } else {
    for (let i = 0; i < typed.length; i++) {
      let cls = typed[i] === target[i] ? 'correct' : 'incorrect';
      let ch = i < target.length ? (target[i] === ' ' ? '&nbsp;' : target[i]) : typed[i];
      if (typed[i] !== target[i] && i < target.length) {
        html += `<span class="char incorrect">${typed[i] === ' ' ? '&nbsp;' : typed[i]}</span>`;
      } else {
        html += `<span class="char ${cls}">${ch}</span>`;
      }
    }
    if (typed.length < target.length) {
      html += `<span class="char current">&nbsp;</span>`;
    }
  }
  display.innerHTML = html;
}

function playCurrentAudio() {
  warmUpSpeech();
  const text = practiceItems[currentIndex].display;
  const isSentence = practiceItems[currentIndex].type === 'sentence';
  speakText(text, isSentence ? 0.85 : 0.75);
  const btn = document.getElementById('btn-play');
  if (btn) {
    btn.classList.add('playing');
    setTimeout(() => btn && btn.classList.remove('playing'), 2000);
  }
}

function revealDictation() {
  dictationRevealed = true;
  const display = document.getElementById('dictation-display');
  if (display) display.classList.add('revealed');
  const info = document.getElementById('dictation-info');
  if (info) info.style.display = 'block';

  const target = practiceItems[currentIndex].display;
  const input = document.getElementById('typing-input');
  if (input) {
    input.value = target;
    input.classList.add('incorrect');
  }
  renderDictationDisplay(target);

  const btn = document.getElementById('btn-reveal');
  if (btn) {
    btn.textContent = '\u2705 \u5df2\u663e\u793a\uff0c\u70b9\u51fb\u4e0b\u4e00\u4e2a';
    btn.disabled = false;
    btn.onclick = skipItem;
  }

  if (!dictationSubmitted) {
    currentItemHadError = true;
    currentErrors++;
    dictationSubmitted = true;
    if (!isWrongMode) {
      addWrongItem(practiceItems[currentIndex]);
    }
  }
}

function handleInput(e) {
  if (isTransitioning) return;
  if (!practiceStartTime) practiceStartTime = Date.now();

  const input = e.target;
  const typed = input.value;
  const target = practiceItems[currentIndex].display;

  if (currentMode === 'dictation' || isWrongMode) {
    renderDictationDisplay(typed);
  } else {
    renderWordDisplay(typed);
  }

  if (typed.length > 0 && typed.length <= target.length) {
    totalKeystrokes++;
    if (typed[typed.length - 1] === target[typed.length - 1]) {
      correctKeystrokes++;
    } else {
      incorrectChars++;
      currentErrors++;
      currentItemHadError = true;
    }
  }
  
  updateStats();
  
  if (typed === target) {
    handleCorrect();
  } else {
    if (typed.length > 0 && typed.length <= target.length && typed[typed.length - 1] !== target[typed.length - 1]) {
      input.classList.add('incorrect');
    } else {
      input.classList.remove('incorrect');
    }
  }
}

function handleKeyDown(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    skipItem();
  }
  if (e.key === 'Escape' && (currentMode === 'dictation' || isWrongMode)) {
    e.preventDefault();
    revealDictation();
  }
}

async function handleCorrect() {
  if (isTransitioning) return;
  isTransitioning = true;

  const input = document.getElementById('typing-input');
  if (input) input.disabled = true;

  const item = practiceItems[currentIndex];
  const word = item.display;

  if (isWrongMode) {
    await incrementWrongCorrect(item);
  } else {
    if ((currentMode === 'word' || currentMode === 'dictation') && !currentItemHadError) {
      if (!masteredWords.includes(word)) {
        masteredWords.push(word);
      }
    }
    if (currentItemHadError) {
      await addWrongItem(item);
    }
  }

  updateGlobalStats();
  if (synth) synth.cancel();

  if (currentMode === 'dictation' || isWrongMode) {
    showDictationResult(item);
  } else {
    advanceToNext();
  }
}

function showDictationResult(item) {
  const display = document.getElementById('dictation-display');
  const info = document.getElementById('dictation-info');
  const area = document.getElementById('practice-area');

  if (display) {
    display.classList.add('revealed');
    let html = '';
    for (let i = 0; i < item.display.length; i++) {
      html += `<span class="char correct">${item.display[i] === ' ' ? '&nbsp;' : item.display[i]}</span>`;
    }
    display.innerHTML = html;
  }
  if (info) info.style.display = 'block';

  const hintEl = document.querySelector('.dictation-hint');
  if (hintEl) hintEl.remove();
  const audioControls = document.querySelector('.audio-controls');
  if (audioControls) audioControls.remove();

  const actionRow = area.querySelector('.action-row');
  if (actionRow) {
    actionRow.innerHTML = `<div class="dictation-result-timer" id="dictation-timer">10\u79d2\u540e\u81ea\u52a8\u4e0b\u4e00\u4e2a</div><button class="btn btn-primary" onclick="advanceToNext()">\u7acb\u5373\u4e0b\u4e00\u4e2a</button>`;
  }

  const text = item.display;
  const rate = item.type === 'sentence' ? 0.85 : 0.75;
  let keepRepeating = true;

  function playRepeat() {
    if (!keepRepeating) return;
    speakText(text, rate, () => {
      if (!keepRepeating) return;
      setTimeout(() => {
        if (keepRepeating) playRepeat();
      }, 1000);
    });
  }
  playRepeat();

  let countdown = 10;
  const timerEl = document.getElementById('dictation-timer');
  dictationAutoAdvanceTimer = setInterval(() => {
    countdown--;
    if (timerEl) timerEl.textContent = countdown + '\u79d2\u540e\u81ea\u52a8\u4e0b\u4e00\u4e2a';
    if (countdown <= 0) {
      keepRepeating = false;
      advanceToNext();
    }
  }, 1000);

  // Store the stop function so advanceToNext/skipItem can stop the repeat loop
  dictationRepeatStop = () => {
    keepRepeating = false;
    if (synth) synth.cancel();
  };
}

function advanceToNext() {
  if (dictationAutoAdvanceTimer) {
    clearInterval(dictationAutoAdvanceTimer);
    dictationAutoAdvanceTimer = null;
  }
  if (dictationRepeatStop) {
    dictationRepeatStop();
    dictationRepeatStop = null;
  }
  if (synth) synth.cancel();

  currentIndex++;
  currentErrors = 0;
  currentItemHadError = false;
  dictationRevealed = false;
  dictationSubmitted = false;
  isTransitioning = false;

  if (!isWrongMode) saveProgress();

  if (isWrongMode && currentIndex >= practiceItems.length) {
    startPractice();
    return;
  }

  renderPractice();
}

async function skipItem() {
  if (isTransitioning) return;
  if (!isWrongMode && currentItemHadError && !dictationSubmitted) {
    await addWrongItem(practiceItems[currentIndex]);
  }
  if (dictationAutoAdvanceTimer) {
    clearInterval(dictationAutoAdvanceTimer);
    dictationAutoAdvanceTimer = null;
  }
  if (dictationRepeatStop) {
    dictationRepeatStop();
    dictationRepeatStop = null;
  }
  currentIndex++;
  currentErrors = 0;
  currentItemHadError = false;
  dictationRevealed = false;
  dictationSubmitted = false;
  isTransitioning = false;
  if (synth) synth.cancel();
  if (!isWrongMode) saveProgress();
  renderPractice();
}

function restartUnit() {
  if (dictationAutoAdvanceTimer) {
    clearInterval(dictationAutoAdvanceTimer);
    dictationAutoAdvanceTimer = null;
  }
  if (dictationRepeatStop) {
    dictationRepeatStop();
    dictationRepeatStop = null;
  }
  currentIndex = 0;
  practiceStartTime = null;
  totalKeystrokes = 0;
  correctKeystrokes = 0;
  incorrectChars = 0;
  currentErrors = 0;
  currentItemHadError = false;
  dictationRevealed = false;
  dictationSubmitted = false;
  isTransitioning = false;
  if (synth) synth.cancel();
  if (isWrongMode) {
    startPractice();
  } else {
    renderPractice();
  }
}

function updateStats() {
  const elapsed = practiceStartTime ? (Date.now() - practiceStartTime) / 1000 / 60 : 0;
  const wpm = elapsed > 0 ? Math.round((correctKeystrokes / 5) / elapsed) : 0;
  const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
  
  const wpmEl = document.getElementById('stat-wpm');
  const accEl = document.getElementById('stat-acc');
  if (wpmEl) wpmEl.textContent = wpm;
  if (accEl) accEl.textContent = accuracy + '%';
}

function renderResults() {
  const elapsed = practiceStartTime ? (Date.now() - practiceStartTime) / 1000 / 60 : 0;
  const wpm = elapsed > 0 ? Math.round((correctKeystrokes / 5) / elapsed) : 0;
  const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
  
  if (!isWrongMode) {
    const key = `${currentChapter}-${currentUnit}`;
    if (accuracy >= 80) {
      unitProgress[key] = 'done';
      renderSidebar();
      const chapter = bookData[currentChapter];
      const unitItems = document.querySelectorAll('.chapter-item')[currentChapter].querySelectorAll('.unit-item');
      if (unitItems[currentUnit]) {
        unitItems[currentUnit].classList.add('completed');
      }
    }
  }
  
  const area = document.getElementById('practice-area');
  area.innerHTML = `
    <div class="result-screen">
      <h2>${isWrongMode ? '错题集练习完成！' : '练习完成！'}</h2>
      <div class="result-stats">
        <div class="result-stat">
          <div class="value" style="color: var(--accent-hover)">${wpm}</div>
          <div class="label">WPM (每分钟字数)</div>
        </div>
        <div class="result-stat">
          <div class="value" style="color: ${accuracy >= 80 ? 'var(--success)' : 'var(--warning)'}">${accuracy}%</div>
          <div class="label">正确率</div>
        </div>
        <div class="result-stat">
          <div class="value" style="color: var(--text)">${practiceItems.length}</div>
          <div class="label">练习数量</div>
        </div>
        <div class="result-stat">
          <div class="value" style="color: var(--text)">${Math.round(elapsed * 60)}s</div>
          <div class="label">用时</div>
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" onclick="restartUnit()">再练一次</button>
        ${isWrongMode ? '<button class="btn" onclick="switchToWord()">返回学习</button>' : `<button class="btn" onclick="switchMode()">${currentMode === 'word' ? '练句子' : currentMode === 'sentence' ? '听写练习' : '练单词'}</button>`}
      </div>
    </div>
  `;

  updateGlobalStats();
}

function switchToWord() {
  currentMode = 'word';
  isWrongMode = false;
  updateModeTabs();
  if (currentChapter !== null) {
    startPractice();
  } else {
    renderWelcome();
  }
}

function switchMode() {
  const modes = ['word', 'sentence', 'dictation'];
  const idx = modes.indexOf(currentMode);
  currentMode = modes[(idx + 1) % modes.length];
  isWrongMode = false;
  updateModeTabs();
  if (currentChapter !== null) {
    startPractice();
  }
}

function updateModeTabs() {
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === currentMode);
  });
}

function updateGlobalStats() {
  const totalWords = bookData.reduce((sum, ch) => sum + ch.units.reduce((s, u) => s + u.words.length, 0), 0);
  const totalSentences = bookData.reduce((sum, ch) => sum + ch.units.reduce((s, u) => s + u.sentences.length, 0), 0);
  
  document.getElementById('stat-practiced').textContent = Object.keys(unitProgress).length;
  document.getElementById('stat-mastered').textContent = masteredWords.length;
  
  if (totalKeystrokes > 0) {
    const acc = Math.round((correctKeystrokes / totalKeystrokes) * 100);
    document.getElementById('stat-accuracy').textContent = acc + '%';
  }
}

function renderWelcome(savedProgress) {
  const area = document.getElementById('practice-area');
  const totalWords = bookData.reduce((sum, ch) => sum + ch.units.reduce((s, u) => s + u.words.length, 0), 0);
  const totalSentences = bookData.reduce((sum, ch) => sum + ch.units.reduce((s, u) => s + u.sentences.length, 0), 0);
  
  let resumeBtn = '';
  if (savedProgress && savedProgress.chapter !== null && savedProgress.chapter !== undefined) {
    const ch = bookData[savedProgress.chapter];
    const unit = ch.units[savedProgress.unit];
    const modeNames = { word: '单词模式', sentence: '句子模式', dictation: '听写模式' };
    resumeBtn = `<button class="btn-resume" onclick="resumeLearning(${savedProgress.chapter}, ${savedProgress.unit}, '${savedProgress.mode}', ${savedProgress.index || 0})">继续学习：${ch.chapter} > ${unit.title} (${modeNames[savedProgress.mode]})</button>`;
  }
  
  area.innerHTML = `
    <div class="welcome-screen">
      ${resumeBtn}
      <h2>美国人每天说的话</h2>
      <p>基于赖世雄、吴纪维合著的《美国人每天说的话》，通过打字练习强化英语单词和句子的记忆。<br>
      共 <strong style="color:var(--accent-hover)">${bookData.length}</strong> 章、<strong style="color:var(--accent-hover)">${bookData.reduce((s,c)=>s+c.units.length,0)}</strong> 个单元、<strong style="color:var(--accent-hover)">${totalWords}</strong> 个单词、<strong style="color:var(--accent-hover)">${totalSentences}</strong> 个例句。</p>
      <div class="welcome-features">
        <div class="feature-card">
          <div class="icon">\u2328\ufe0f</div>
          <h3>打字练习</h3>
          <p>逐字符比对输入，绿色正确红色错误，强化肌肉记忆</p>
        </div>
        <div class="feature-card">
          <div class="icon">\ud83c\udfa7</div>
          <h3>听写模式</h3>
          <p>先播放标准美式发音，听音打字，输入后自动纠错</p>
        </div>
        <div class="feature-card">
          <div class="icon">\ud83d\udcdd</div>
          <h3>错题集</h3>
          <p>出错的题目自动加入错题集，连续答对${CORRECT_THRESHOLD}次后移除</p>
        </div>
        <div class="feature-card">
          <div class="icon">\ud83d\udcca</div>
          <h3>进度保存</h3>
          <p>登录后自动保存学习进度，下次打开继续上次的位置</p>
        </div>
      </div>
      <button class="btn-start" onclick="selectUnit(0, 0)">开始练习</button>
    </div>
  `;
}

function resumeLearning(ci, ui, mode, startIndex) {
  currentChapter = ci;
  currentUnit = ui;
  currentMode = mode || 'word';
  isWrongMode = false;
  updateModeTabs();
  
  const chapter = bookData[ci];
  const unit = chapter.units[ui];
  
  document.querySelectorAll('.unit-item').forEach(el => el.classList.remove('active'));
  const chapterDiv = document.querySelectorAll('.chapter-item')[ci];
  chapterDiv.classList.add('expanded');
  const unitItems = chapterDiv.querySelectorAll('.unit-item');
  if (unitItems[ui]) unitItems[ui].classList.add('active');
  
  const breadcrumb = document.getElementById('breadcrumb');
  breadcrumb.innerHTML = `${chapter.chapter} > <span>${unit.title}</span>`;
  
  startPractice(startIndex || 0);
}

// Mode tabs
document.getElementById('mode-tabs').addEventListener('click', async (e) => {
  const tab = e.target.closest('.mode-tab');
  if (!tab) return;
  const mode = tab.dataset.mode;
  if (mode === currentMode) return;
  if (mode === 'wrong') {
    openWrongItems();
    return;
  }
  const wasWrongMode = currentMode === 'wrong';
  currentMode = mode;
  isWrongMode = false;
  updateModeTabs();
  if (currentChapter !== null) {
    let startIndex = 0;
    if (wasWrongMode && currentUser && db) {
      const saved = await dbGet('progress', currentUser.email);
      if (saved && saved.mode === mode && saved.chapter === currentChapter && saved.unit === currentUnit) {
        startIndex = saved.index || 0;
      }
    }
    startPractice(startIndex);
    saveProgress();
  }
});

// Fix mobile viewport height (address bar issue)
function setAppHeight() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', vh + 'px');
  document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 100));

// Global error handler - ensure page stays usable even if some JS fails
window.addEventListener('error', function(e) {
  console.error('Global error:', e.message);
  // Don't prevent default behavior, just log
});

// Start
init();
</script>
